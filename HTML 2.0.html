<style>

<script>
const LG={en:'English',hi:'हिन्दी',kn:'ಕನ್ನಡ',te:'తెలుగు',ta:'தமிழ்'},LI=['hi','kn','te','ta'],LCM={en:'en',hi:'hi-IN-u-nu-latn',kn:'kn-IN-u-nu-latn',te:'te-IN-u-nu-latn',ta:'ta-IN-u-nu-latn'},LC=()=>LCM[S.lang]||'en';

const ld=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10),days=s=>Date.parse(s)/864e5;

const SK='cv4',PK=['p','plans','ex','ev','loc','est','st','open','sm'];let S=load();
function init(){const d=new Date(),a=n=>ld(new Date(+d+n*864e5));return{th:'auto',lang:'en',tab:'home',cm:0,p:{name:'',type:'PMAY house',fl:'G',lat:'',lng:'',rad:50,budget:'',start:a(0)},plans:{},ex:[],ev:[],loc:null,rates:{cement:420,steel:65,sand:1800,agg:1600,brick:8},est:{t:'footing',pct:1,v:{}},sm:smd(),st:['Site layout','Excavation','Footing','Plinth','Column','Beam & slab','Brickwork','Plaster & finish'].map((n,i)=>({n,ps:a(i*14),pe:a(i*14+12),as:'',ae:'',pr:0}))}}
function load(){let s;try{s=JSON.parse(localStorage.getItem(SK))}catch(e){}s=s||init();if(!s.pj||!s.pj.length){const o={};PK.forEach(k=>o[k]=s[k]);s.pj=[o];s.cur=0}if(!s.pj[s.cur])s.cur=0;if(!LG[s.lang])s.lang='en';s.pj.forEach(o=>{o.sm=Object.assign(smd(),o.sm);const MG={'Ground floor plan':'Column','Complete house plan':HP},n={};for(const k in o.plans||{}){const t=MG[k]||(SLN.includes(k)?k:null);if(t&&!n[t])n[t]=o.plans[k]}o.plans=n});PK.forEach(k=>s[k]=s.pj[s.cur][k]);return s}
const pk=()=>{const o={};PK.forEach(k=>o[k]=S[k]);return o};
function fresh(){const i=init(),o={};PK.forEach(k=>o[k]=i[k]);return o}
function sw(i){S.pj[S.cur]=pk();S.cur=i;PK.forEach(k=>S[k]=S.pj[i][k]);S.cm=0;S.cf=null}
function projCard(){return `<div class=c><span class=k>Projects</span>${S.pj.map((x,i)=>{const d=i===S.cur?S:x,nm=d.p.name||`Project ${i+1}`,pg=Math.round(d.st.reduce((a,y)=>a+(+y.pr||0),0)/d.st.length);return `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px dashed var(--l)"><span><b${d.p.name?' translate=no':''}>${esc(nm)}</b><small class=m>${esc(d.p.type)} · ${pg}% complete</small></span><span style="display:flex;gap:6px;align-items:center">${i===S.cur?'<span class="ch o">Open</span>':`<button class="b sm" data-a=sw data-i=${i}>Open</button>`}<button class="b g sm" data-a=delp data-i=${i}>${S.cf==i?'Confirm':'Remove'}</button></span></div>`}).join('')}<div style="margin-top:8px"><button class="b g sm" data-a=addp>+ Add project</button></div></div>`}
function save(){try{S.pj[S.cur]=pk();localStorage.setItem(SK,JSON.stringify({th:S.th,lang:S.lang,tab:S.tab,cm:S.cm,rates:S.rates,cur:S.cur,pj:S.pj}))}catch(e){toast('Storage full: remove some evidence photos')}}

்"],["Complete house plan","पूरे घर का नक्शा","ಸಂಪೂರ್ಣ ಮನೆ ನಕ್ಷೆ","పూర్తి ఇంటి ప్లాన్","முழு வீட்டு வரைபடம்"],["Ground floor plan","भूतल का नक्शा","ನೆಲ ಮಹಡಿ ನಕ್ಷೆ","గ్రౌండ్ ఫ్లోర్ ప్లాన్","தரைத்தள வரைபடம்"],["First floor plan","प्रथम तल का नक्शा","ಮೊದಲ ಮಹಡಿ ನಕ್ಷೆ","ఫస్ట్ ఫ్లోర్ ప్లాన్","முதல் தள வரைபடம்"],["Elevation drawing","एलिवेशन ड्रॉइंग","ಎಲಿವೇಶನ್ ರೇಖಾಚಿತ್ರ","ఎలివేషన్ డ్రాయింగ్","முகப்புத் தோற்ற வரைபடம்"],["Specifications","विनिर्देश","ವಿಶೇಷಣಗಳು","స్పెసిఫికేషన్లు","விவரக்குறிப்புகள்"],["Missing","अनुपलब्ध","ಇಲ್ಲ","లేదు","இல்லை"],["Only file details and extracted facts are kept on this device. Files are not stored.","केवल फ़ाइल का विवरण और निकाली गई जानकारी इसी डिवाइस पर रखी जाती है। फ़ाइलें सहेजी नहीं जातीं।","ಫೈಲ್ ವಿವರಗಳು ಮತ್ತು ಹೊರತೆಗೆದ ಮಾಹಿತಿ ಮಾತ್ರ ಈ ಸಾಧನದಲ್ಲಿ ಉಳಿಯುತ್ತವೆ. ಫೈಲ್‌ಗಳನ್ನು ಸಂಗ್ರಹಿಸುವುದಿಲ್ಲ.","ఫైల్ వివరాలు మరియు సేకరించిన సమాచారం మాత్రమే ఈ పరికరంలో ఉంటాయి. ఫైళ్లు నిల్వ చేయబడవు.","கோப்பு விவரங்களும் எடுக்கப்பட்ட தகவல்களும் மட்டுமே இந்தச் சாதனத்தில் வைக்கப்படும். கோப்புகள் சேமிக்கப்படாது."],["DWG is not parsed here. Convert it to DXF. DXF files and text-based PDFs are read by rules, not AI, and you can send what they find to Estimate. Scanned PDFs and images need dimensions entered in Estimate. The app asks instead of guessing.","DWG यहाँ नहीं पढ़ी जाती। इसे DXF में बदलें। DXF फ़ाइलें और टेक्स्ट वाली PDF नियमों से पढ़ी जाती हैं, AI से नहीं, और जो मिलता है उसे आप अनुमान में भेज सकते हैं। स्कैन की गई PDF और इमेज के लिए माप अनुमान में खुद दर्ज करने होंगे। ऐप अंदाज़ा लगाने के बजाय पूछता है।","DWG ಅನ್ನು ಇಲ್ಲಿ ಓದಲಾಗುವುದಿಲ್ಲ. ಅದನ್ನು DXF ಗೆ ಪರಿವರ್ತಿಸಿ. DXF ಫೈಲ್‌ಗಳು ಮತ್ತು ಪಠ್ಯ ಆಧಾರಿತ PDF ಗಳನ್ನು ನಿಯಮಗಳ ಮೂಲಕ ಓದಲಾಗುತ್ತದೆ, AI ಅಲ್ಲ; ಸಿಕ್ಕಿದ್ದನ್ನು ಅಂದಾಜಿಗೆ ಕಳುಹಿಸಬಹುದು. ಸ್ಕ್ಯಾನ್ ಮಾಡಿದ PDF ಮತ್ತು ಚಿತ್ರಗಳಿಗೆ ಅಳತೆಗಳನ್ನು ಅಂದಾಜಿನಲ್ಲಿ ನೀವೇ ನಮೂದಿಸಬೇಕು. ಅಪ್ಲಿಕೇಶನ್ ಊಹಿಸುವ ಬದಲು ಕೇಳುತ್ತದೆ.","DWG ఇక్కడ చదవబడదు. దాన్ని DXF గా మార్చండి. DXF ఫైళ్లు మరియు టెక్స్ట్ ఉన్న PDF లను నియమాల ద్వారా చదువుతారు, AI కాదు; దొరికినదాన్ని అంచనాకు పంపవచ్చు. స్కాన్ చేసిన PDF లు మరియు చిత్రాలకు కొలతలను అంచనాలో మీరే నమోదు చేయాలి. యాప్ ఊహించడానికి బదులు అడుగుతుంది.","DWG இங்கே படிக்கப்படாது. அதை DXF ஆக மாற்றவும். DXF கோப்புகளும் உரை உள்ள PDF களும் விதிகளால் படிக்கப்படுகின்றன, AI அல்ல; கிடைத்ததை மதிப்பீட்டுக்கு அனுப்பலாம். ஸ்கேன் செய்த PDF மற்றும் படங்களுக்கு அளவுகளை மதிப்பீட்டில் நீங்களே உள்ளிட வேண்டும். ஊகிப்பதற்குப் பதிலாக செயலி கேட்கும்."],["# characters of text read.","# अक्षरों का पाठ पढ़ा गया।","# ಅಕ್ಷರಗಳ ಪಠ್ಯ ಓದಲಾಗಿದೆ.","# అక్షరాల టెక్స్ట్ చదవబడింది.","# எழுத்துகளின் உரை படிக்கப்பட்டது."],["# drawn rectangles read for the #D model.","# आयत पढ़े गए, #D मॉडल के लिए।","# ಆಯತಗಳನ್ನು ಓದಲಾಗಿದೆ, #D ಮಾದರಿಗಾಗಿ.","# దీర్ఘచతురస్రాలు చదవబడ్డాయి, #D మోడల్ కోసం.","# செவ்வகங்கள் படிக்கப்பட்டன, #D மாதிரிக்காக."],["# drawing items read.","# ड्रॉइंग आइटम पढ़े गए।","# ರೇಖಾಚಿತ್ರ ಅಂಶಗಳನ್ನು ಓದಲಾಗಿದೆ.","# డ్రాయింగ్ అంశాలు చదవబడ్డాయి.","# வரைபட உருப்படிகள் படிக்கப்பட்டன."],["Could not read this PDF. Open the page once online, or enter dimensions in Estimate.","यह PDF नहीं पढ़ी जा सकी। पेज को एक बार ऑनलाइन खोलें, या अनुमान में माप दर्ज करें।","ಈ PDF ಓದಲಾಗಲಿಲ್ಲ. ಪುಟವನ್ನು ಒಮ್ಮೆ ಆನ್‌ಲೈನ್‌ನಲ್ಲಿ ತೆರೆಯಿರಿ, ಅಥವಾ ಅಂದಾಜಿನಲ್ಲಿ ಅಳತೆಗಳನ್ನು ನಮೂದಿಸಿ.","ఈ PDF చదవడం సాధ్యం కాలేదు. పేజీని ఒకసారి ఆన్‌లైన్‌లో తెరవండి, లేదా అంచనాలో కొలతలు నమోదు చేయండి.","இந்த PDF ஐப் படிக்க முடியவில்லை. பக்கத்தை ஒருமுறை ஆன்லைனில் திறக்கவும், அல்லது மதிப்பீட்டில் அளவுகளை உள்ளிடவும்."],["DWG not parsed. Convert to DXF.","DWG नहीं पढ़ी गई। DXF में बदलें।","DWG ಓದಲಾಗಿಲ್ಲ. DXF ಗೆ ಪರಿವರ್ತಿಸಿ.","DWG చదవబడలేదు. DXF గా మార్చండి.","DWG படிக்கப்படவில்லை. DXF ஆக மாற்றவும்."],["Dimensions need manual entry in Estimate.","माप अनुमान में खुद दर्ज करने होंगे।","ಅಳತೆಗಳನ್ನು ಅಂದಾಜಿನಲ್ಲಿ ಕೈಯಾರೆ ನಮೂದಿಸಬೇಕು.","కొలతలను అంచనాలో మాన్యువల్‌గా నమోదు చేయాలి.","அளவுகளை மதிப்பீட்டில் கைமுறையாக உள்ளிட வேண்டும்."],["Image plans cannot be read offline. Enter dimensions in Estimate.","इमेज वाले नक्शे ऑफ़लाइन नहीं पढ़े जा सकते। अनुमान में माप दर्ज करें।","ಚಿತ್ರ ನಕ್ಷೆಗಳನ್ನು ಆಫ್‌ಲೈನ್‌ನಲ್ಲಿ ಓದಲಾಗುವುದಿಲ್ಲ. ಅಂದಾಜಿನಲ್ಲಿ ಅಳತೆಗಳನ್ನು ನಮೂದಿಸಿ.","చిత్ర ప్లాన్లను ఆఫ్‌లైన్‌లో చదవలేము. అంచనాలో కొలతలు నమోదు చేయండి.","பட வரைபடங்களை ஆஃப்லைனில் படிக்க முடியாது. மதிப்பீட்டில் அளவுகளை உள்ளிடவும்."],["No readable text (scanned or image-only).","पढ़ने योग्य टेक्स्ट नहीं (स्कैन या केवल इमेज)।","ಓದಬಹುದಾದ ಪಠ್ಯವಿಲ್ಲ (ಸ್ಕ್ಯಾನ್ ಅಥವಾ ಚಿತ್ರ ಮಾತ್ರ).","చదవగలిగే టెక్స్ట్ లేదు (స్కాన్ లేదా చిత్రం మాత్రమే).","படிக்கக்கூடிய உரை இல்லை (ஸ்கேன் அல்லது படம் மட்டும்)."],["Plan reading","नक्शा पढ़ना","ನಕ್ಷೆ ಓದುವಿಕೆ","ప్లాన్ చదవడం","வரைபடம் படித்தல்"],["rule-based, not AI","नियम-आधारित, AI नहीं","ನಿಯಮ ಆಧಾರಿತ, AI ಅಲ್ಲ","నియమ ఆధారిత, AI కాదు","விதி அடிப்படையிலானது, AI அல்ல"],["Layer","लेयर","ಲೇಯರ್","లేయర్","அடுக்கு"],["Items","आइटम","ಅಂಶಗಳು","అంశాలు","உருப்படிகள்"],["Length","लंबाई","ಉದ್ದ","పొడవు","நீளம்"],["Room","कमरा","ಕೋಣೆ","గది","அறை"],["Area","क्षेत्रफल","ವಿಸ್ತೀರ್ಣ","విస్తీర్ణం","பரப்பளவு"],["Size","आकार","ಗಾತ್ರ","పరిమాణం","அளவு"],["Drawing unit","ड्रॉइंग की इकाई","ರೇಖಾಚಿತ್ರದ ಘಟಕ","డ్రాయింగ్ యూనిట్","வரைபட அலகு"],["# drawing items found. The unit is not declared in the file: choose it above. Nothing is converted or guessed until you do.","# ड्रॉइंग आइटम मिले। फ़ाइल में इकाई नहीं दी गई है: ऊपर से चुनें। जब तक आप नहीं चुनते, कुछ भी बदला या अनुमानित नहीं किया जाता।","# ರೇಖಾಚಿತ್ರ ಅಂಶಗಳು ಸಿಕ್ಕಿವೆ. ಫೈಲ್‌ನಲ್ಲಿ ಘಟಕ ನೀಡಿಲ್ಲ: ಮೇಲೆ ಆಯ್ಕೆಮಾಡಿ. ನೀವು ಆಯ್ಕೆಮಾಡುವವರೆಗೆ ಏನನ್ನೂ ಪರಿವರ್ತಿಸಲಾಗುವುದಿಲ್ಲ ಅಥವಾ ಊಹಿಸಲಾಗುವುದಿಲ್ಲ.","# డ్రాయింగ్ అంశాలు దొరికాయి. ఫైల్‌లో యూనిట్ ఇవ్వలేదు: పైన ఎంచుకోండి. మీరు ఎంచుకునే వరకు ఏదీ మార్చబడదు లేదా ఊహించబడదు.","# வரைபட உருப்படிகள் கிடைத்தன. கோப்பில் அலகு குறிப்பிடப்படவில்லை: மேலே தேர்ந்தெடுக்கவும். நீங்கள் தேர்ந்தெடுக்கும் வரை எதுவும் மாற்றப்படாது அல்லது ஊகிக்கப்படாது."],["Wall length from layer WALL","WALL लेयर से दीवार की लंबाई","WALL ಲೇಯರ್‌ನಿಂದ ಗೋಡೆಯ ಉದ್ದ","WALL లేయర్ నుండి గోడ పొడవు","WALL அடுக்கிலிருந்து சுவர் நீளம்"],["Column count from column layer","कॉलम लेयर से कॉलम की संख्या","ಕಂಬ ಲೇಯರ್‌ನಿಂದ ಕಂಬಗಳ ಸಂಖ್ಯೆ","కాలమ్ లేయర్ నుండి స్తంభాల సంఖ్య","தூண் அடுக்கிலிருந்து தூண்களின் எண்ணிக்கை"],["Slab area: largest closed outline","स्लैब क्षेत्रफल: सबसे बड़ी बंद रूपरेखा","ಸ್ಲ್ಯಾಬ್ ವಿಸ್ತೀರ್ಣ: ಅತಿ ದೊಡ್ಡ ಮುಚ್ಚಿದ ಹೊರರೇಖೆ","స్లాబ్ విస్తీర్ణం: అతిపెద్ద మూసివున్న అవుట్‌లైన్","ஸ்லாப் பரப்பளவு: மிகப்பெரிய மூடிய வெளிக்கோடு"],["Slab area: sum of # labelled room(s)","स्लैब क्षेत्रफल: # नामित कमरों का योग","ಸ್ಲ್ಯಾಬ್ ವಿಸ್ತೀರ್ಣ: # ಹೆಸರಿಸಿದ ಕೋಣೆಗಳ ಮೊತ್ತ","స్లాబ్ విస్తీర్ణం: # లేబుల్ గదుల మొత్తం","ஸ்லாப் பரப்பளவு: # பெயரிடப்பட்ட அறைகளின் கூட்டுத்தொகை"],["Slab area: sum of # room(s) read from text","स्लैब क्षेत्रफल: टेक्स्ट से पढ़े # कमरों का योग","ಸ್ಲ್ಯಾಬ್ ವಿಸ್ತೀರ್ಣ: ಪಠ್ಯದಿಂದ ಓದಿದ # ಕೋಣೆಗಳ ಮೊತ್ತ","స్లాబ్ విస్తీర్ణం: టెక్స్ట్ నుండి చదివిన # గదుల మొత్తం","ஸ்லாப் பரப்பளவு: உரையிலிருந்து படித்த # அறைகளின் கூட்டுத்தொகை"],["Room label","कमरे का लेबल","ಕೋಣೆಯ ಲೇಬಲ್","గది లేబుల్","அறை லேபிள்"],["stated area","बताया गया क्षेत्रफल","ಹೇಳಿದ ವಿಸ್ತೀರ್ಣ","పేర్కొన్న విస్తీర్ణం","குறிப்பிடப்பட்ட பரப்பளவு"],["Text found, but no room sizes with clear units (ft, m or mm). Enter dimensions in Estimate.","टेक्स्ट मिला, लेकिन स्पष्ट इकाई (ft, m या mm) वाले कमरों के माप नहीं मिले। अनुमान में माप दर्ज करें।","ಪಠ್ಯ ಸಿಕ್ಕಿದೆ, ಆದರೆ ಸ್ಪಷ್ಟ ಘಟಕ (ft, m ಅಥವಾ mm) ಇರುವ ಕೋಣೆಯ ಅಳತೆಗಳು ಇಲ್ಲ. ಅಂದಾಜಿನಲ್ಲಿ ಅಳತೆಗಳನ್ನು ನಮೂದಿಸಿ.","టెక్స్ట్ దొరికింది, కానీ స్పష్టమైన యూనిట్లు (ft, m లేదా mm) ఉన్న గది కొలతలు లేవు. అంచనాలో కొలతలు నమోదు చేయండి.","உரை கிடைத்தது, ஆனால் தெளிவான அலகுகள் (ft, m அல்லது mm) உள்ள அறை அளவுகள் இல்லை. மதிப்பீட்டில் அளவுகளை உள்ளிடவும்."],["No readable text. This looks like a scanned or image-only drawing. Reading it needs an AI vision service; enter dimensions in Estimate.","पढ़ने योग्य टेक्स्ट नहीं मिला। यह स्कैन या केवल इमेज वाला ड्रॉइंग लगता है। इसे पढ़ने के लिए AI विज़न सेवा चाहिए; अनुमान में माप दर्ज करें।","ಓದಬಹುದಾದ ಪಠ್ಯವಿಲ್ಲ. ಇದು ಸ್ಕ್ಯಾನ್ ಅಥವಾ ಚಿತ್ರ ಮಾತ್ರದ ರೇಖಾಚಿತ್ರದಂತೆ ಕಾಣುತ್ತದೆ. ಓದಲು AI ವಿಷನ್ ಸೇವೆ ಬೇಕು; ಅಂದಾಜಿನಲ್ಲಿ ಅಳತೆಗಳನ್ನು ನಮೂದಿಸಿ.","చదవగలిగే టెక్స్ట్ లేదు. ఇది స్కాన్ లేదా చిత్రం మాత్రమే ఉన్న డ్రాయింగ్ లాగా ఉంది. దీన్ని చదవడానికి AI విజన్ సేవ కావాలి; అంచనాలో కొలతలు నమోదు చేయండి.","படிக்கக்கூடிய உரை இல்லை. இது ஸ்கேன் அல்லது படம் மட்டுமுள்ள வரைபடம் போலத் தெரிகிறது. இதைப் படிக்க AI பார்வை சேவை தேவை; மதிப்பீட்டில் அளவுகளை உள்ளிடவும்."],["This plan specifies a richer concrete grade than the M# #:#:# thumb rule used in Estimate. Check cement quantities.","इस नक्शे में अनुमान में प्रयुक्त M# #:#:# मोटे नियम से ऊँचे ग्रेड का कंक्रीट बताया गया है। सीमेंट की मात्रा जाँचें।","ಈ ನಕ್ಷೆಯಲ್ಲಿ ಅಂದಾಜಿನಲ್ಲಿ ಬಳಸಿದ M# #:#:# ಅಂದಾಜು ನಿಯಮಕ್ಕಿಂತ ಉನ್ನತ ದರ್ಜೆಯ ಕಾಂಕ್ರೀಟ್ ಹೇಳಲಾಗಿದೆ. ಸಿಮೆಂಟ್ ಪ್ರಮಾಣವನ್ನು ಪರಿಶೀಲಿಸಿ.","ఈ ప్లాన్‌లో అంచనాలో వాడిన M# #:#:# సుమారు నియమం కంటే మెరుగైన కాంక్రీట్ గ్రేడ్ పేర్కొన్నారు. సిమెంట్ పరిమాణాలను తనిఖీ చేయండి.","இந்த வரைபடத்தில் மதிப்பீட்டில் பயன்படுத்தப்பட்ட M# #:#:# தோராய விதியை விட உயர்ந்த கான்கிரீட் தரம் குறிப்பிடப்பட்டுள்ளது. சிமெண்ட் அளவுகளைச் சரிபார்க்கவும்."],["Thumb-rule quantities. They are not structural design or engineer approval.","मोटे नियम से निकली मात्राएँ। ये स्ट्रक्चरल डिज़ाइन या इंजीनियर की मंज़ूरी नहीं हैं।","ಅಂದಾಜು ನಿಯಮದ ಪ್ರಮಾಣಗಳು. ಇವು ರಚನಾತ್ಮಕ ವಿನ್ಯಾಸ ಅಥವಾ ಎಂಜಿನಿಯರ್ ಅನುಮೋದನೆ ಅಲ್ಲ.","సుమారు నియమం ప్రకారం పరిమాణాలు. ఇవి స్ట్రక్చరల్ డిజైన్ లేదా ఇంజనీర్ ఆమోదం కావు.","தோராய விதிப்படியான அளவுகள். இவை கட்டமைப்பு வடிவமைப்போ பொறியாளர் ஒப்புதலோ அல்ல."],["Assumes the PDF was printed at full size, not fit to page.","मान लिया गया है कि PDF पूरे आकार में प्रिंट हुई थी, पेज में फ़िट करके नहीं।","PDF ಅನ್ನು ಪುಟಕ್ಕೆ ಹೊಂದಿಸದೆ ಪೂರ್ಣ ಗಾತ್ರದಲ್ಲಿ ಮುದ್ರಿಸಲಾಗಿದೆ ಎಂದು ಊಹಿಸಲಾಗಿದೆ.","PDF ను పేజీకి సరిపోయేలా కాకుండా పూర్తి పరిమాణంలో ప్రింట్ చేశారని భావించబడింది.","PDF பக்கத்திற்குப் பொருத்தாமல் முழு அளவில் அச்சிடப்பட்டதாகக் கருதப்படுகிறது."],["Element","तत्व","ಘಟಕ ಅಂಶ","భాగం","உறுப்பு"],["footing","फुटिंग","ಅಡಿಪಾಯ (ಫುಟಿಂಗ್)","ఫుటింగ్","அடித்தளம் (புட்டிங்)"],["column","कॉलम","ಕಂಬ","స్తంభం","தூண்"],["slab","स्लैब","ಸ್ಲ್ಯಾಬ್","స్లాబ్","ஸ்லாப்"],["wall","दीवार","ಗೋಡೆ","గోడ","சுவர்"],["Nos","संख्या","ಸಂಖ್ಯೆ","సంఖ్య","எண்ணிக்கை"],["#,# nos","#,# संख्या","#,# ಸಂಖ್ಯೆ","#,# సంఖ్య","#,# எண்ணிக்கை"],["Length (m)","लंबाई (m)","ಉದ್ದ (m)","పొడవు (m)","நீளம் (m)"],["Width (m)","चौड़ाई (m)","ಅಗಲ (m)","వెడల్పు (m)","அக "ಸೈಟ್ ಗಡಿಯೊಳಗೆ ಹೊಸ GPS ಫಿಕ್ಸ್ ಸಿಕ್ಕ ನಂತರವೇ ಕ್ಯಾಮೆರಾ ತೆರೆಯುತ್ತದೆ.","సైట్ సరిహద్దు లోపల కొత్త GPS ఫిక్స్ వచ్చిన తర్వాత మాత్రమే కెమెరా తెరుచుకుంటుంది.","தள எல்லைக்குள் புதிய GPS நிலை கிடைத்த பிறகே கேமரா திறக்கும்."],["A client-side GPS check can be spoofed. This is a location check, not tamper-proof proof of presence.","क्लाइंट-साइड GPS जाँच में हेराफेरी हो सकती है। यह लोकेशन जाँच है, उपस्थिति का छेड़छाड़-रोधी प्रमाण नहीं।","ಕ್ಲೈಂಟ್-ಸೈಡ್ GPS ಪರಿಶೀಲನೆಯನ್ನು ವಂಚಿಸಬಹುದು. ಇದು ಸ್ಥಳ ಪರಿಶೀಲನೆ, ಹಾಜರಾತಿಯ ಛೇದರಹಿತ ಪುರಾವೆ ಅಲ್ಲ.","క్లయింట్-సైడ్ GPS తనిఖీని మోసగించవచ్చు. ఇది లొకేషన్ తనిఖీ మాత్రమే, హాజరుకు ట్యాంపర్-ప్రూఫ్ రుజువు కాదు.","கிளையன்ட்-பக்க GPS சரிபார்ப்பை ஏமாற்ற முடியும். இது இருப்பிடச் சரிபார்ப்பு மட்டுமே, இருப்பதற்கான மாற்ற முடியாத ஆதாரம் அல்ல."],["Inside geofence: # m from centre, accuracy ±# m.","जियोफ़ेंस के अंदर: केंद्र से # m, सटीकता ±# m।","ಜಿಯೋಫೆನ್ಸ್ ಒಳಗೆ: ಕೇಂದ್ರದಿಂದ # m, ನಿಖರತೆ ±# m.","జియోఫెన్స్ లోపల: కేంద్రం నుండి # m, ఖచ్చితత్వం ±# m.","ஜியோஃபென்ஸுக்குள்: மையத்திலிருந்து # m, துல்லியம் ±# m."],["Outside geofence: # m from centre, radius # m.","जियोफ़ेंस के बाहर: केंद्र से # m, त्रिज्या # m।","ಜಿಯೋಫೆನ್ಸ್ ಹೊರಗೆ: ಕೇಂದ್ರದಿಂದ # m, ತ್ರಿಜ್ಯ # m.","జియోఫెన్స్ వెలుపల: కేంద్రం నుండి # m, వ్యాసార్థం # m.","ஜியோஃபென்ஸுக்கு வெளியே: மையத்திலிருந்து # m, ஆரம் # m."],["GPS accuracy ±# m is too coarse (limit # m). Retry outdoors.","GPS सटीकता ±# m बहुत कम है (सीमा # m)। बाहर खुले में दोबारा कोशिश करें।","GPS ನಿಖರತೆ ±# m ತುಂಬಾ ಕಡಿಮೆ (ಮಿತಿ # m). ಹೊರಗೆ ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ.","GPS ఖచ్చితత్వం ±# m చాలా తక్కువ (పరిమితి # m). బయట మళ్లీ ప్రయత్నించండి.","GPS துல்லியம் ±# m மிகவும் குறைவு (வரம்பு # m). வெளியே மீண்டும் முயற்சிக்கவும்."],["Location check expired. Check again.","लोकेशन जाँच की अवधि समाप्त। दोबारा जाँचें।","ಸ್ಥಳ ಪರಿಶೀಲನೆ ಅವಧಿ ಮುಗಿದಿದೆ. ಮತ್ತೆ ಪರಿಶೀಲಿಸಿ.","లొకేషన్ తనిఖీ గడువు ముగిసింది. మళ్లీ తనిఖీ చేయండి.","இருப்பிடச் சரிபார்ப்பு காலாவதியானது. மீண்டும் சரிபார்க்கவும்."],["Set site coordinates on Home first.","पहले होम पर साइट निर्देशांक सेट करें।","ಮೊದಲು ಮುಖಪುಟದಲ್ಲಿ ಸ್ಥಳದ ನಿರ್ದೇಶಾಂಕ ಹೊಂದಿಸಿ.","ముందుగా హోమ్‌లో సైట్ కోఆర్డినేట్లు సెట్ చేయండి.","முதலில் முகப்பில் தள ஆயங்களை அமைக்கவும்."],["Permission denied. Allow location in your browser or app settings.","अनुमति नहीं मिली। अपने ब्राउज़र या ऐप सेटिंग में लोकेशन की अनुमति दें।","ಅನುಮತಿ ನಿರಾಕರಿಸಲಾಗಿದೆ. ನಿಮ್ಮ ಬ್ರೌಸರ್ ಅಥವಾ ಅಪ್ಲಿಕೇಶನ್ ಸೆಟ್ಟಿಂಗ್‌ಗಳಲ್ಲಿ ಸ್ಥಳಕ್ಕೆ ಅನುಮತಿ ನೀಡಿ.","అనుమతి నిరాకరించబడింది. మీ బ్రౌజర్ లేదా యాప్ సెట్టింగ్‌లలో లొకేషన్‌ను అనుమతించండి.","அனுமதி மறுக்கப்பட்டது. உங்கள் உலாவி அல்லது செயலி அமைப்புகளில் இருப்பிடத்தை அனுமதிக்கவும்."],["Could not get a location fix.","लोकेशन फ़िक्स नहीं मिल सका।","ಸ್ಥಳ ಫಿಕ್ಸ್ ಪಡೆಯಲಾಗಲಿಲ್ಲ.","లొకేషన్ ఫిక్స్ పొందలేకపోయాం.","இருப்பிட நிலையைப் பெற முடியவில்லை."],["No site evidence yet","अभी तक साइट का कोई प्रमाण नहीं","ಇನ್ನೂ ಸೈಟ್ ಪುರಾವೆ ಇಲ್ಲ","ఇంకా సైట్ ఆధారాలు లేవు","இன்னும் தள ஆதாரம் இல்லை"],["Note","टिप्पणी","ಟಿಪ್ಪಣಿ","గమనిక","குறிப்பு"],["Building model","भवन मॉडल","ಕಟ್ಟಡ ಮಾದರಿ","భవన నమూనా","கட்டிட மாதிரி"],["structure only","केवल ढाँचा","ರಚನೆ ಮಾತ್ರ","నిర్మాణం మాత్రమే","கட்டமைப்பு மட்டும்"],["#D structural model coloured by construction status","निर्माण स्थिति के अनुसार रंगा #D स्ट्रक्चरल मॉडल","ನಿರ್ಮಾಣ ಸ್ಥಿತಿಯ ಪ್ರಕಾರ ಬಣ್ಣಹಚ್ಚಿದ #D ರಚನಾತ್ಮಕ ಮಾದರಿ","నిర్మాణ స్థితి ప్రకారం రంగులు వేసిన #D స్ట్రక్చరల్ మోడల్","கட்டுமான நிலைக்கு ஏற்ப வண்ணமிடப்பட்ட #D கட்டமைப்பு மாதிரி"],["Rotate ⟳","घुमाएँ ⟳","ತಿರುಗಿಸಿ ⟳","తిప్పండి ⟳","சுழற்று ⟳"],["Rotate","घुमाएँ","ತಿರುಗಿಸಿ","తిప్పండి","சுழற்று"],["Built","निर्मित","ಪೂರ್ಣಗೊಂಡಿದೆ","పూర్తయింది","முடிந்தது"],["Ongoing","जारी","ನಡೆಯುತ್ತಿದೆ","కొనసాగుతోంది","நடைபெறுகிறது"],["# built · # ongoing · # planned","# निर्मित · # जारी · # नियोजित","# ಪೂರ್ಣ · # ನಡೆಯುತ್ತಿದೆ · # ಯೋಜಿತ","# పూర్తి · # కొనసాగుతోంది · # ప్రణాళిక","# முடிந்தது · # நடைபெறுகிறது · # திட்டமிடப்பட்டது"],["Foundation","नींव","ಅಡಿಪಾಯ","పునాది","அடித்தளம்"],["Columns","कॉलम","ಕಂಬಗಳು","స్తంభాలు","தூண்கள்"],["Beams","बीम","ಬೀಮ್‌ಗಳು","బీమ్‌లు","பீம்கள்"],["Slabs","स्लैब","ಸ್ಲ್ಯಾಬ್‌ಗಳು","స్లాబ్‌లు","ஸ்லாப்கள்"],["Slab","स्लैब","ಸ್ಲ್ಯಾಬ್","స్లాబ్","ஸ்லாப்"],["Structural #D model settings","स्ट्रक्चरल #D मॉडल सेटिंग","ರಚನಾತ್ಮಕ #D ಮಾದರಿ ಸೆಟ್ಟಿಂಗ್‌ಗಳು","స్ట్రక్చరల్ #D మోడల్ సెట్టింగ్‌లు","கட்டமைப்பு #D மாதிரி அமைப்புகள்"],["Uses the Ground floor and First floor plans as CAD-exported PDFs (not scans). Only foundation, columns, beams and slab are modelled. The site layout is not needed.","भूतल और प्रथम तल के नक्शों को CAD से निकली PDF (स्कैन नहीं) के रूप में इस्तेमाल करता है। केवल नींव, कॉलम, बीम और स्लैब का मॉडल बनता है। साइट लेआउट की ज़रूरत नहीं है।","ನೆಲ ಮತ್ತು ಮೊದಲ ಮಹಡಿ ನಕ್ಷೆಗಳನ್ನು CAD ನಿಂದ ರಫ್ತಾದ PDF ಗಳಾಗಿ (ಸ್ಕ್ಯಾನ್ ಅಲ್ಲ) ಬಳಸುತ್ತದೆ. ಅಡಿಪಾಯ, ಕಂಬ, ಬೀಮ್ ಮತ್ತು ಸ್ಲ್ಯಾಬ್ ಮಾತ್ರ ಮಾದರಿಯಾಗುತ್ತವೆ. ಸೈಟ್ ವಿನ್ಯಾಸ ಬೇಕಿಲ್ಲ.","గ్రౌండ్ మరియు ఫస్ట్ ఫ్లోర్ ప్లాన్లను CAD నుండి ఎగుమతి చేసిన PDF లుగా (స్కాన్ కాదు) ఉపయోగిస్తుంది. పునాది, స్తంభాలు, బీమ్‌లు మరియు స్లాబ్ మాత్రమే మోడల్ చేయబడతాయి. సైట్ లేఔట్ అవసరం లేదు.","தரை மற்றும் முதல் தள வரைபடங்களை CAD இலிருந்து ஏற்றுமதி செய்த PDF களாக (ஸ்கேன் அல்ல) பயன்படுத்துகிறது. அடித்தளம், தூண்கள், பீம்கள், ஸ்லாப் மட்டுமே மாதிரியாக்கப்படும். தள அமைப்பு தேவையில்லை."],["Drawing scale # : N","ड्रॉइंग स्केल # : N","ರೇಖಾಚಿತ್ರ ಮಾಪಕ # : N","డ్రాయింగ్ స్కేల్ # : N","வரைபட அளவுகோல் # : N"],["Storey height (m)","मंज़िल की ऊँचाई (m)","ಮಹಡಿ ಎತ್ತರ (m)","అంతస్తు ఎత్తు (m)","தள உயரம் (m)"],["Foundation depth below ground (m)","भूमि के नीचे नींव की गहराई (m)","ನೆಲದ ಕೆಳಗೆ ಅಡಿಪಾಯದ ಆಳ (m)","భూమి కింద పునాది లోతు (m)","நிலத்தடி அடித்தள ஆழம் (m)"],["Default footing size (m)","डिफ़ॉल्ट फुटिंग आकार (m)","ಡಿಫಾಲ್ಟ್ ಫುಟಿಂಗ್ ಗಾತ್ರ (m)","డిఫాల్ట్ ఫుటింగ్ పరిమాణం (m)","இயல்புநிலை புட்டிங் அளவு (m)"],["Plinth height (m)","प्लिंथ की ऊँचाई (m)","ಪ್ಲಿಂತ್ ಎತ್ತರ (m)","ప్లింత్ ఎత్తు (m)","பிளிந்த் உயரம் (m)"],["Beam depth (m)","बीम की गहराई (m)","ಬೀಮ್ ಆಳ (m)","బీమ్ లోతు (m)","பீம் ஆழம் (m)"],["Check the model settings: every value must be above zero, foundation depth above # m, and beam depth above slab thickness.","मॉडल सेटिंग जाँचें: हर मान शून्य से ऊपर होना चाहिए, नींव की गहराई # m से अधिक, और बीम की गहराई स्लैब की मोटाई से अधिक।","ಮಾದರಿ ಸೆಟ್ಟಿಂಗ್‌ಗಳನ್ನು ಪರಿಶೀಲಿಸಿ: ಪ್ರತಿ ಮೌಲ್ಯ ಸೊನ್ನೆಗಿಂತ ಹೆಚ್ಚಿರಬೇಕು, ಅಡಿಪಾಯದ ಆಳ # m ಗಿಂತ ಹೆಚ್ಚು, ಮತ್ತು ಬೀಮ್ ಆಳ ಸ್ಲ್ಯಾಬ್ ದಪ್ಪಕ್ಕಿಂತ ಹೆಚ್ಚು.","మోడల్ సెట్టింగ్‌లను తనిఖీ చేయండి: ప్రతి విలువ సున్నా కంటే ఎక్కువ ఉండాలి, పునాది లోతు # m కంటే ఎక్కువ, బీమ్ లోతు స్లాబ్ మందం కంటే ఎక్కువ.","மாதிரி அமைப்புகளைச் சரிபார்க்கவும்: ஒவ்வொரு மதிப்பும் பூஜ்யத்திற்கு மேல் இருக்க வேண்டும், அடித்தள ஆழம் # m க்கு மேல், பீம் ஆழம் ஸ்லாப் தடிமனுக்கு மேல்."],["Set the drawing scale (# : N) under Plans, Structural #D model settings.","नक्शे में स्ट्रक्चरल #D मॉडल सेटिंग के अंतर्गत ड्रॉइंग स्केल (# : N) सेट करें।","ನಕ್ಷೆಗಳಲ್ಲಿ ರಚನಾತ್ಮಕ #D ಮಾದರಿ ಸೆಟ್ಟಿಂಗ್‌ಗಳ ಅಡಿಯಲ್ಲಿ ರೇಖಾಚಿತ್ರ ಮಾಪಕ (# : N) ಹೊಂದಿಸಿ.","ప్లాన్లలో స్ట్రక్చరల్ #D మోడల్ సెట్టింగ్‌ల కింద డ్రాయింగ్ స్కేల్ (# : N) సెట్ చేయండి.","வரைபடங்களில் கட்டமைப்பு #D மாதிரி அமைப்புகளின் கீழ் வரைபட அளவுகோலை (# : N) அமைக்கவும்."],["GF: # columns and # footing outlines found","GF: # कॉलम और # फुटिंग आउटलाइन मिले","GF: # ಕಂಬಗಳು ಮತ್ತು # ಫುಟಿಂಗ್ ರೇಖೆಗಳು ಸಿಕ್ಕಿವೆ","GF: # స్తంభాలు మరియు # ఫుటింగ్ అవుట్‌లైన్‌లు దొరికాయి","GF: # தூண்கள் மற்றும் # புட்டிங் வெளிக்கோடுகள் கிடைத்தன"],["FF: # columns and # footing outlines found","FF: # कॉलम और # फुटिंग आउटलाइन मिले","FF: # ಕಂಬಗಳು ಮತ್ತು # ಫುಟಿಂಗ್ ರೇಖೆಗಳು ಸಿಕ್ಕಿವೆ","FF: # స్తంభాలు మరియు # ఫుటింగ్ అవుట్‌లైన్‌లు దొరికాయి","FF: # தூண்கள் மற்றும் # புட்டிங் வெளிக்கோடுகள் கிடைத்தன"],["GF: no drawing geometry read yet","GF: अभी तक ड्रॉइंग ज्यामिति नहीं पढ़ी गई","GF: ಇನ್ನೂ ರೇಖಾಚಿತ್ರ ಜ್ಯಾಮಿತಿ ಓದಿಲ್ಲ","GF: ఇంకా డ్రాయింగ్ జ్యామితి చదవలేదు","GF: இன்னும் வரைபட வடிவவியல் படிக்கப்படவில்லை"],["FF: no drawing geometry read yet","FF: अभी तक ड्रॉइंग ज्यामिति नहीं पढ़ी गई","FF: ಇನ್ನೂ ರೇಖಾಚಿತ್ರ ಜ್ಯಾಮಿತಿ ಓದಿಲ್ಲ","FF: ఇంకా డ్రాయింగ్ జ్యామితి చదవలేదు","FF: இன்னும் வரைபட வடிவவியல் படிக்கப்படவில்லை"],["No columns found in the ground floor plan. The model needs a CAD-exported PDF that draws columns as small closed rectangles. Scanned PDFs cannot be used.","भूतल के नक्शे में कोई कॉलम नहीं मिला। मॉडल को CAD से निकली ऐसी PDF चाहिए जिसमें कॉलम छोटे बंद आयत के रूप में बने हों। स्कैन की गई PDF काम नहीं करेंगी।","ನೆಲ ಮಹಡಿ ನಕ್ಷೆಯಲ್ಲಿ ಕಂಬಗಳು ಸಿಗಲಿಲ್ಲ. ಮಾದರಿಗೆ ಕಂಬಗಳನ್ನು ಸಣ್ಣ ಮುಚ್ಚಿದ ಆಯತಗಳಾಗಿ ಬರೆದಿರುವ CAD ರಫ್ತಾದ PDF ಬೇಕು. ಸ್ಕ್ಯಾನ್ ಮಾಡಿದ PDF ಬಳಸಲಾಗುವುದಿಲ್ಲ.","గ్రౌండ్ ఫ్లోర్ ప్లాన్‌లో స్తంభాలు దొరకలేదు. మోడల్‌కు స్తంభాలను చిన్న మూసివున్న దీర్ఘచతురస్రాలుగా గీసిన CAD ఎగుమతి PDF కావాలి. స్కాన్ చేసిన PDF లు ఉపయోగించలేము.","தரைத்தள வரைபடத்தில் தூண்கள் எதுவும் கிடைக்கவில்லை. மாதிரிக்கு தூண்களை சிறிய மூடிய செவ்வகங்களாக வரைந்த CAD ஏற்றுமதி PDF தேவை. ஸ்கேன் செய்த PDF களைப் பயன்படுத்த முடியாது."],["Grid span read as # × # m. Check it against a known dimension. If it is wrong, the scale or the print size is wrong.","ग्रिड विस्तार # × # m पढ़ा गया। इसे किसी ज्ञात माप से मिलाएँ। यदि गलत है, तो स्केल या प्रिंट आकार गलत है।","ಗ್ರಿಡ್ ವ್ಯಾಪ್ತಿ # × # m ಎಂದು ಓದಲಾಗಿದೆ. ತಿಳಿದ ಅಳತೆಯೊಂದಿಗೆ ತಾಳೆ ನೋಡಿ. ತಪ್ಪಾಗಿದ್ದರೆ ಮಾಪಕ ಅಥವಾ ಮುದ್ರಣ ಗಾತ್ರ ತಪ್ಪಾಗಿದೆ.","గ్రిడ్ విస్తీర్ణం # × # m గా చదవబడింది. తెలిసిన కొలతతో సరిచూడండి. తప్పయితే స్కేల్ లేదా ప్రింట్ పరిమాణం తప్పు.","கிரிட் பரப்பு # × # m என படிக்கப்பட்டது. தெரிந்த அளவுடன் ஒப்பிட்டுப் பார்க்கவும். தவறாக இருந்தால் அளவுகோல் அல்லது அச்சு அளவு தவறு."],["# footing(s) use the default size because no footing outline was found.","# फुटिंग डिफ़ॉल्ट आकार का उपयोग करती हैं क्योंकि कोई फुटिंग आउटलाइन नहीं मिली।","# ಫುಟಿಂಗ್‌ಗಳು ಡಿಫಾಲ್ಟ್ ಗಾತ್ರ ಬಳಸುತ್ತವೆ, ಏಕೆಂದರೆ ಫುಟಿಂಗ್ ರೇಖೆ ಸಿಗಲಿಲ್ಲ.","# ఫుటింగ్(లు) డిఫాల్ట్ పరిమాణాన్ని ఉపయోగిస్తాయి, ఎందుకంటే ఫుటింగ్ అవుట్‌లైన్ దొరకలేదు.","# புட்டிங் இயல்புநிலை அளவைப் பயன்படுத்துகின்றன, ஏனெனில் புட்டிங் வெளிக்கோடு கிடைக்கவில்லை."],["Colours follow each stage's progress percentage in the order ground floor first, then left to right. They are not surveyed positions. Beams and slabs follow the column grid.","रंग हर चरण के प्रगति प्रतिशत के अनुसार हैं: पहले भूतल, फिर बाएँ से दाएँ। ये सर्वे की गई जगहें नहीं हैं। बीम और स्लैब कॉलम ग्रिड के अनुसार हैं।","ಬಣ್ಣಗಳು ಪ್ರತಿ ಹಂತದ ಪ್ರಗತಿ ಶೇಕಡಾವಾರು ಅನುಸರಿಸುತ್ತವೆ: ಮೊದಲು ನೆಲ ಮಹಡಿ, ನಂತರ ಎಡದಿಂದ ಬಲಕ್ಕೆ. ಇವು ಸರ್ವೇ ಮಾಡಿದ ಸ್ಥಾನಗಳಲ್ಲ. ಬೀಮ್ ಮತ್ತು ಸ್ಲ್ಯಾಬ್ ಕಂಬ ಗ್ರಿಡ್ ಅನುಸರಿಸುತ್ತವೆ.","రంగులు ప్రతి దశ పురోగతి శాతాన్ని అనుసరిస్తాయి: ముందు గ్రౌండ్ ఫ్లోర్, తర్వాత ఎడమ నుండి కుడికి. ఇవి సర్వే చేసిన స్థానాలు కావు. బీమ్‌లు మరియు స్లాబ్‌లు స్తంభాల గ్రిడ్‌ను అనుసరిస్తాయి.","நிறங்கள் ஒவ்வொரு நிலையின் முன்னேற்ற சதவீதத்தைப் பின்பற்றுகின்றன: முதலில் தரைத்தளம், பிறகு இடமிருந்து வலம். இவை அளவெடுத்த இடங்கள் அல்ல. பீம்களும் ஸ்லாப்களும் தூண் கிரிட்டைப் பின்பற்றும்."],["First floor plan not read, so only the ground floor is shown.","प्रथम तल का नक्शा नहीं पढ़ा गया, इसलिए केवल भूतल दिखाया गया है।","ಮೊದಲ ಮಹಡಿ ನಕ್ಷೆ ಓದಿಲ್ಲ, ಆದ್ದರಿಂದ ನೆಲ ಮಹಡಿ ಮಾತ್ರ ತೋರಿಸಲಾಗಿದೆ.","ఫస్ట్ ఫ్లోర్ ప్లాన్ చదవలేదు, కాబట్టి గ్రౌండ్ ఫ్లోర్ మాత్రమే చూపబడింది.","முதல் தள வரைபடம் படிக்கப்படவில்லை, எனவே தரைத்தளம் மட்டும் காட்டப்படுகிறது."],["Column items: #","कॉलम आइटम: #","ಕಂಬದ ಅಂಶಗಳು: #","స్తంభం అంశాలు: #","தூண் உருப்படிகள்: #"],["If each wall is drawn as two lines, halve this.","यदि हर दीवार दो रेखाओं से बनी है, तो इसे आधा करें।","ಪ್ರತಿ ಗೋಡೆಯನ್ನು ಎರಡು ಗೆರೆಗಳಿಂದ ಬರೆದಿದ್ದರೆ ಇದನ್ನು ಅರ್ಧ ಮಾಡಿ.","ప్రతి గోడను రెండు గీతలుగా గీసినట్లయితే, దీన్ని సగం చేయండి.","ஒவ்வொரு சுவரும் இரண்டு கோடுகளாக வரையப்பட்டிருந்தால், இதை பாதியாக்கவும்."],["Site weather","साइट का मौसम","ಸ್ಥಳದ ಹವಾಮಾನ","సైట్ వాతావరణం","தள வானிலை"],["curing advice","क्योरिंग (तराई) की सलाह","ಕ್ಯೂರಿಂಗ್ ಸಲಹೆ","క్యూరింగ్ సలహా","கியூரிங் ஆலோசனை"],["Get weather","मौसम देखें","ಹವಾಮಾನ ಪಡೆಯಿರಿ","వాతావరణం పొందండి","வானிலையைப் பெறு"],["Checking weather at your location…","आपकी लोकेशन का मौसम जाँचा जा रहा है…","ನಿಮ್ಮ ಸ್ಥಳದ ಹವಾಮಾನ ಪರಿಶೀಲಿಸಲಾಗುತ್ತಿದೆ…","మీ లొకేషన్‌లో వాతావరణం తనిఖీ చేస్తోంది…","உங்கள் இருப்பிடத்தின் வானிலை சரிபார்க்கப்படுகிறது…"],["Could not load weather. It needs an internet connection.","मौसम लोड नहीं हो सका। इसके लिए इंटरनेट कनेक्शन चाहिए।","ಹವಾಮಾನ ಲೋಡ್ ಆಗಲಿಲ್ಲ. ಇದಕ್ಕೆ ಇಂಟರ್ನೆಟ್ ಸಂಪರ್ಕ ಬೇಕು.","వాతావరణం లోడ్ కాలేదు. దీనికి ఇంటర్నెట్ కనెక్షన్ కావాలి.","வானிலையை ஏற்ற முடியவில்லை. இதற்கு இணைய இணைப்பு தேவை."],["Location permission denied. Set the site coordinates on Home to get weather without it.","लोकेशन की अनुमति नहीं मिली। इसके बिना मौसम पाने के लिए होम पर साइट निर्देशांक सेट करें।","ಸ್ಥಳದ ಅನುಮತಿ ನಿರಾಕರಿಸಲಾಗಿದೆ. ಅದಿಲ್ಲದೆ ಹವಾಮಾನ ಪಡೆಯಲು ಮುಖಪುಟದಲ್ಲಿ ಸ್ಥಳದ ನಿರ್ದೇಶಾಂಕ ಹೊಂದಿಸಿ.","లొకేషన్ అనుమతి నిరాకరించబడింది. అది లేకుండా వాతావరణం పొందడానికి హోమ్‌లో సైట్ కోఆర్డినేట్లు సెట్ చేయండి.","இருப்பிட அனுமதி மறுக்கப்பட்டது. அது இல்லாமல் வானிலை பெற முகப்பில் தள ஆயங்களை அமைக்கவும்."],["Humidity #%","आर्द्रता #%","ತೇವಾಂಶ #%","తేమ #%","ஈரப்பதம் #%"],["Wind # km/h","हवा # km/h","ಗಾಳಿ # km/h","గాలి # km/h","காற்று # km/h"],["Rain # mm","बारिश # mm","ಮಳೆ # mm","వర్షం # mm","மழை # mm"],["Open-Meteo, updated #:#, for the site coordinates. Advice only; your engineer decides.","Open-Meteo, #:# पर अपडेट, साइट निर्देशांक के लिए। केवल सलाह; निर्णय आपके इंजीनियर का है।","Open-Meteo, #:# ಕ್ಕೆ ನವೀಕರಿಸಲಾಗಿದೆ, ಸ್ಥಳದ ನಿರ್ದೇಶಾಂಕಗಳಿಗೆ. ಸಲಹೆ ಮಾತ್ರ; ನಿರ್ಧಾರ ನಿಮ್ಮ ಎಂಜಿನಿಯರ್‌ದು.","Open-Meteo, #:# కి నవీకరించబడింది, సైట్ కోఆర్డినేట్ల కోసం. సలహా మాత్రమే; నిర్ణయం మీ ఇంజనీర్‌ది.","Open-Meteo, #:# க்கு புதுப்பிக்கப்பட்டது, தள ஆயங்களுக்காக. ஆலோசனை மட்டுமே; முடிவு உங்கள் பொறியாளருடையது."],["Open-Meteo, updated #:#, for your device location. Advice only; your engineer decides.","Open-Meteo, #:# पर अपडेट, आपके डिवाइस की लोकेशन के लिए। केवल सलाह; निर्णय आपके इंजीनियर का है।","Open-Meteo, #:# ಕ್ಕೆ ನವೀಕರಿಸಲಾಗಿದೆ, ನಿಮ್ಮ ಸಾಧನದ ಸ್ಥಳಕ್ಕೆ. ಸಲಹೆ ಮಾತ್ರ; ನಿರ್ಧಾರ ನಿಮ್ಮ ಎಂಜಿನಿಯರ್‌ದು.","Open-Meteo, #:# కి నవీకరించబడింది, మీ పరికర లొకేషన్ కోసం. సలహా మాత్రమే; నిర్ణయం మీ ఇంజనీర్‌ది.","Open-Meteo, #:# க்கு புதுப்பிக்கப்பட்டது, உங்கள் சாதன இருப்பிடத்துக்காக. ஆலோசனை மட்டுமே; முடிவு உங்கள் பொறியாளருடையது."],["Clear","साफ़","ಸ್ಪಷ್ಟ","తేటగా","தெளிவு"],["Partly cloudy","आंशिक बादल","ಭಾಗಶಃ ಮೋಡ","పాక్షికంగా మేఘావృతం","பகுதி மேகமூட்டம்"],["Fog","कोहरा","ಮಂಜು","పొగమంచు","மூடுபனி"],["Overcast","घने बादल","ಮೋಡ ಕವಿದಿದೆ","మేఘావృతం","மேகமூட்டம்"],["Rain","बारिश","ಮಳೆ","వర్షం","மழை"],["Raining:","बारिश:","ಮಳೆ:","వర్షం:","மழை:"],["High temperature:","ऊँचा तापमान:","ಹೆಚ್ಚಿನ ತಾಪಮಾನ:","అధిక ఉష్ణోగ్రత:","அதிக வெப்பநிலை:"],["Dry or windy:","शुष्क या हवादार:","ಒಣ ಅಥವಾ ಗಾಳಿ:","పొడి లేదా గాలులు:","வறண்ட அல்லது காற்று:"],["Cold:","ठंड:","ಚಳಿ:","చలి:","குளிர்:"],["Normal weather:","सामान्य मौसम:","ಸಾಮಾನ್ಯ ಹವಾಮಾನ:","సాధారణ వాతావరణం:","இயல்பான வானிலை:"],["Do not cure now. The rain is already wetting the concrete, so save water. Cover freshly cast concrete with a tarpaulin against heavy rain.","अभी तराई (क्योरिंग) न करें। बारिश से कंक्रीट पहले ही गीला है, इसलिए पानी बचाएँ। ताज़ा डाले कंक्रीट को भारी बारिश से बचाने के लिए तिरपाल से ढकें।","ಈಗ ಕ್ಯೂರಿಂಗ್ ಮಾಡಬೇಡಿ. ಮಳೆ ಈಗಾಗಲೇ ಕಾಂಕ್ರೀಟ್ ಅನ್ನು ತೇವಗೊಳಿಸುತ್ತಿದೆ, ಆದ್ದರಿಂದ ನೀರು ಉಳಿಸಿ. ಹೊಸದಾಗಿ ಹಾಕಿದ ಕಾಂಕ್ರೀಟ್ ಅನ್ನು ಭಾರೀ ಮಳೆಯಿಂದ ರಕ್ಷಿಸಲು ಟಾರ್ಪಾಲಿನ್‌ನಿಂದ ಮುಚ್ಚಿ.","ఇప్పుడు క్యూరింగ్ చేయవద్దు. వర్షం ఇప్పటికే కాంక్రీట్‌ను తడుపుతోంది, కాబట్టి నీటిని ఆదా చేయండి. కొత్తగా వేసిన కాంక్రీట్‌ను భారీ వర్షం నుండి కాపాడటానికి టార్పాలిన్‌తో కప్పండి.","இப்போது கியூரிங் செய்ய வேண்டாம். மழை ஏற்கனவே கான்கிரீட்டை நனைக்கிறது, எனவே தண்ணீரைச் சேமிக்கவும். புதிதாக ஊற்றிய கான்கிரீட்டை கனமழையிலிருந்து காக்க தார்ப்பாலினால் மூடவும்."],["Cure with wet gunny bags and keep them wet. Re-wet often, and water early morning and evening. In hot, dry weather cure for at least # days (IS #).","गीले बोरे (गनी बैग) से तराई करें और उन्हें गीला रखें। बार-बार भिगोएँ, और सुबह जल्दी तथा शाम को पानी दें। गर्म, शुष्क मौसम में कम से कम # दिन तराई करें (IS #)।","ಒದ್ದೆ ಗೋಣಿಚೀಲಗಳಿಂದ ಕ್ಯೂರಿಂಗ್ ಮಾಡಿ ಮತ್ತು ಅವನ್ನು ಒದ್ದೆಯಾಗಿ ಇಡಿ. ಆಗಾಗ ಮತ್ತೆ ನೆನೆಸಿ, ಮುಂಜಾನೆ ಮತ್ತು ಸಂಜೆ ನೀರು ಹಾಕಿ. ಬಿಸಿ, ಒಣ ಹವೆಯಲ್ಲಿ ಕನಿಷ್ಠ # ದಿನ ಕ್ಯೂರಿಂಗ್ ಮಾಡಿ (IS #).","తడి గోనె సంచులతో క్యూరింగ్ చేసి వాటిని తడిగా ఉంచండి. తరచుగా మళ్లీ తడపండి, తెల్లవారుజామున మరియు సాయంత్రం నీరు పోయండి. వేడి, పొడి వాతావరణంలో కనీసం # రోజులు క్యూరింగ్ చేయండి (IS #).","ஈரமான சாக்குப் பைகளால் கியூரிங் செய்து அவற்றை ஈரமாக வைத்திருங்கள். அடிக்கடி மீண்டும் நனைத்து, அதிகாலையிலும் மாலையிலும் தண்ணீர் ஊற்றுங்கள். வெப்பமான, வறண்ட வானிலையில் குறைந்தது # நாட்கள் கியூரிங் செய்யுங்கள் (IS #)."],["Surfaces dry out fast. Keep them continuously moist and shield fresh concrete from the wind.","सतहें जल्दी सूखती हैं। उन्हें लगातार नम रखें और ताज़ा कंक्रीट को हवा से बचाएँ।","ಮೇಲ್ಮೈಗಳು ಬೇಗ ಒಣಗುತ್ತವೆ. ಅವನ್ನು ನಿರಂತರವಾಗಿ ತೇವವಾಗಿ ಇಡಿ ಮತ್ತು ಹೊಸ ಕಾಂಕ್ರೀಟ್ ಅನ್ನು ಗಾಳಿಯಿಂದ ರಕ್ಷಿಸಿ.","ఉపరితలాలు త్వరగా ఎండిపోతాయి. వాటిని నిరంతరం తడిగా ఉంచండి మరియు కొత్త కాంక్రీట్‌ను గాలి నుండి కాపాడండి.","மேற்பரப்புகள் விரைவாக உலர்ந்துவிடும். அவற்றை தொடர்ந்து ஈரமாக வைத்து, புதிய கான்கிரீட்டை காற்றிலிருந்து காக்கவும்."],["Protect fresh concrete from frost. Keep it covered and avoid casting in freezing weather.","ताज़ा कंक्रीट को पाले से बचाएँ। इसे ढककर रखें और जमा देने वाले मौसम में कंक्रीट न डालें।","ಹೊಸ ಕಾಂಕ್ರೀಟ್ ಅನ್ನು ಹಿಮದಿಂದ ರಕ್ಷಿಸಿ. ಅದನ್ನು ಮುಚ್ಚಿಡಿ ಮತ್ತು ಹೆಪ್ಪುಗಟ್ಟುವ ಹವೆಯಲ್ಲಿ ಕಾಂಕ್ರೀಟ್ ಹಾಕಬೇಡಿ.","కొత్త కాంక్రీట్‌ను మంచు నుండి కాపాడండి. కప్పి ఉంచండి మరియు గడ్డకట్టే వాతావరణంలో కాంక్రీట్ వేయవద్దు.","புதிய கான்கிரீட்டை உறைபனியிலிருந்து காக்கவும். மூடி வைத்து, உறையும் வானிலையில் கான்கிரீட் ஊற்றுவதைத் தவிர்க்கவும்."],["Keep concrete surfaces moist for at least # days (# days with blended cements), as in IS #.","IS # के अनुसार कंक्रीट की सतहों को कम से कम # दिन नम रखें (मिश्रित सीमेंट में # दिन)।","IS # ರಂತೆ ಕಾಂಕ್ರೀಟ್ ಮೇಲ್ಮೈಗಳನ್ನು ಕನಿಷ್ಠ # ದಿನ ತೇವವಾಗಿಡಿ (ಮಿಶ್ರ ಸಿಮೆಂಟ್‌ಗಳಿಗೆ # ದಿನ).","IS # ప్రకారం కాంక్రీట్ ఉపరితలాలను కనీసం # రోజులు తడిగా ఉంచండి (మిశ్రమ సిమెంట్లకు # రోజులు).","IS # இன்படி கான்கிரீட் மேற்பரப்புகளை குறைந்தது # நாட்கள் ஈரமாக வைக்கவும் (கலப்பு சிமெண்ட்களுக்கு # நாட்கள்)."],["Spent to date","अब तक का खर्च","ಇಲ್ಲಿಯವರೆಗಿನ ವೆಚ್ಚ","ఇప్పటి వరకు ఖర్చు","இதுவரை செலவு"],["Spent","खर्च हुआ","ಖರ್ಚಾಗಿದೆ","ఖర్చయింది","செலவானது"],["Approved","स्वीकृत","ಅನುಮೋದಿತ","ఆమోదించినది","அங்கீகரிக்கப்பட்டது"],["Remaining","शेष","ಉಳಿದಿದೆ","మిగిలినది","மீதம்"],["Projected at completion","पूर्णता पर अनुमानित","ಪೂರ್ಣಗೊಂಡಾಗ ಅಂದಾಜು","పూర్తయ్యే నాటికి అంచనా","முடிவில் மதிப்பீடு"],["Projected extra funds","अनुमानित अतिरिक्त निधि","ಅಂದಾಜು ಹೆಚ್ಚುವರಿ ನಿಧಿ","అంచనా అదనపు నిధులు","மதிப்பிடப்பட்ட கூடுதல் நிதி"],["Add expenditure","खर्च जोड़ें","ವೆಚ್ಚ ಸೇರಿಸಿ","ఖర్చు జోడించండి","செலவைச் சேர்"],["Date","तिथि","ದಿನಾಂಕ","తేదీ","தேதி"],["Amount (₹)","राशि (₹)","ಮೊ గ్ గుర్తించిన ప్లాన్: ఇంకా డ్రాయింగ్ జ్యామితి చదవలేదు","புட்டிங் குறிக்கப்பட்ட வரைபடம்: இன்னும் வரைபட வடிவவியல் படிக்கப்படவில்லை"],["Uses the Column plan and the Footing marked plan as CAD-exported PDFs (not scans). Only foundation, columns, beams and slab are modelled. Beams and slabs are generated from the column grid.","कॉलम नक्शे और फुटिंग चिह्नित नक्शे को CAD से निकली PDF (स्कैन नहीं) के रूप में इस्तेमाल करता है। केवल नींव, कॉलम, बीम और स्लैब का मॉडल बनता है। बीम और स्लैब कॉलम ग्रिड से बनाए जाते हैं।","ಕಂಬ ನಕ್ಷೆ ಮತ್ತು ಫುಟಿಂಗ್ ಗುರುತಿಸಿದ ನಕ್ಷೆಯನ್ನು CAD ನಿಂದ ರಫ್ತಾದ PDF ಗಳಾಗಿ (ಸ್ಕ್ಯಾನ್ ಅಲ್ಲ) ಬಳಸುತ್ತದೆ. ಅಡಿಪಾಯ, ಕಂಬ, ಬೀಮ್ ಮತ್ತು ಸ್ಲ್ಯಾಬ್ ಮಾತ್ರ ಮಾದರಿಯಾಗುತ್ತವೆ. ಬೀಮ್ ಮತ್ತು ಸ್ಲ್ಯಾಬ್ ಅನ್ನು ಕಂಬ ಗ್ರಿಡ್‌ನಿಂದ ರಚಿಸಲಾಗುತ್ತದೆ.","కాలమ్ ప్లాన్ మరియు ఫుటింగ్ గుర్తించిన ప్లాన్‌ను CAD నుండి ఎగుమతి చేసిన PDF లుగా (స్కాన్ కాదు) ఉపయోగిస్తుంది. పునాది, స్తంభాలు, బీమ్‌లు మరియు స్లాబ్ మాత్రమే మోడల్ చేయబడతాయి. బీమ్‌లు మరియు స్లాబ్‌లు స్తంభాల గ్రిడ్ నుండి రూపొందించబడతాయి.","தூண் வரைபடம் மற்றும் புட்டிங் குறிக்கப்பட்ட வரைபடத்தை CAD இலிருந்து ஏற்றுமதி செய்த PDF களாக (ஸ்கேன் அல்ல) பயன்படுத்துகிறது. அடித்தளம், தூண்கள், பீம்கள், ஸ்லாப் மட்டுமே மாதிரியாக்கப்படும். பீம்களும் ஸ்லாப்களும் தூண் கிரிட்டிலிருந்து உருவாக்கப்படுகின்றன."],["No columns found in the Column plan or the house plan. The model needs a CAD-exported PDF that draws columns as small closed rectangles. Scanned PDFs cannot be used.","कॉलम नक्शे या घर के नक्शे में कोई कॉलम नहीं मिला। मॉडल को CAD से निकली ऐसी PDF चाहिए जिसमें कॉलम छोटे बंद आयत के रूप में बने हों। स्कैन की गई PDF काम नहीं करेंगी।","ಕಂಬ ನಕ್ಷೆ ಅಥವಾ ಮನೆ ನಕ್ಷೆಯಲ್ಲಿ ಕಂಬಗಳು ಸಿಗಲಿಲ್ಲ. ಮಾದರಿಗೆ ಕಂಬಗಳನ್ನು ಸಣ್ಣ ಮುಚ್ಚಿದ ಆಯತಗಳಾಗಿ ಬರೆದಿರುವ CAD ರಫ್ತಾದ PDF ಬೇಕು. ಸ್ಕ್ಯಾನ್ ಮಾಡಿದ PDF ಬಳಸಲಾಗುವುದಿಲ್ಲ.","కాలమ్ ప్లాన్ లేదా ఇంటి ప్లాన్‌లో స్తంభాలు దొరకలేదు. మోడల్‌కు స్తంభాలను చిన్న మూసివున్న దీర్ఘచతురస్రాలుగా గీసిన CAD ఎగుమతి PDF కావాలి. స్కాన్ చేసిన PDF లు ఉపయోగించలేము.","தூண் வரைபடம் அல்லது வீட்டு வரைபடத்தில் தூண்கள் எதுவும் கிடைக்கவில்லை. மாதிரிக்கு தூண்களை சிறிய மூடிய செவ்வகங்களாக வரைந்த CAD ஏற்றுமதி PDF தேவை. ஸ்கேன் செய்த PDF களைப் பயன்படுத்த முடியாது."],["First-floor columns are assumed to sit directly above the ground-floor columns.","पहली मंज़िल के कॉलम भूतल के कॉलमों के ठीक ऊपर माने गए हैं।","ಮೊದಲ ಮಹಡಿಯ ಕಂಬಗಳು ನೆಲ ಮಹಡಿಯ ಕಂಬಗಳ ನೇರ ಮೇಲೆ ಇವೆ ಎಂದು ಊಹಿಸಲಾಗಿದೆ.","మొదటి అంతస్తు స్తంభాలు గ్రౌండ్ ఫ్లోర్ స్తంభాల పైనే ఉన్నాయని భావించబడింది.","முதல் தளத் தூண்கள் தரைத்தளத் தூண்களுக்கு நேர் மேலே இருப்பதாகக் கருதப்படுகிறது."]],TD={};TT.forEach(r=>TD[r[0]]=r.slice(1));

return c}

function gantt(){const t=days(ld(new Date())),ds=[t];S.st.forEach(x=>['ps','pe','as','ae'].forEach(k=>x[k]&&ds.push(days(x[k]))));const mn=Math.min(...ds)-1,W=(Math.max(...ds)+2-mn)*10;
const bz=(s,e,c,p)=>s&&e?`<div class="bz ${c}" style="left:${(days(s)-mn)*10}px;width:${Math.max(10,(days(e)-days(s)+1)*10)}px">${p?`<i style="width:${p}%"></i>`:''}</div>`:'';
return `<div class=sc><div style="min-width:${W+104}px">${S.st.map(x=>`<div class=r><div class=lb>${esc(x.n)}</div><div class=tr style="width:${W}px">${bz(x.ps,x.pe,'pl')}${bz(x.as,x.ae||ld(new Date()),'ac',x.pr)}<u style="left:${(t-mn)*10}px"></u></div></div>`).join('')}</div></div><small class=m>Dashed = planned · filled = actual progress · line = today</small>`}
function sched(){const sts=S.st.map(stat),first=sts.findIndex(s=>s!=='Done'),anyIp=sts.includes('In progress');
return `<div class=c><span class=k>Construction timeline</span>${gantt()}</div>`+S.st.map((x,i)=>{const s=sts[i],cur=s==='In progress'||(!anyIp&&i===first),open=cur||(S.open||{})[i],
hd=`<span><b>${esc(x.n)}</b><small class=m>${x.pr}% complete</small></span><span style="display:flex;align-items:center;gap:10px"><span class="ch ${s==='Delayed'||cur?'o':''}">${cur?'Current · ':''}${s}</span>${cur?'':`<span class="ar${open?' o':''}" aria-hidden="true">▲</span>`}</span>`;
return `<div class="c sg">${cur?`<div class=sh>${hd}</div>`:`<button class=sh data-a=tg data-i=${i} aria-expanded=${!!open}>${hd}</button>`}${open?`<div class=sb><div class=gr>${fi(`st.${i}.ps`,'Planned start',{t:'date'})}${fi(`st.${i}.pe`,'Planned end',{t:'date'})}${fi(`st.${i}.as`,'Actual start',{t:'date'})}${fi(`st.${i}.ae`,'Actual end',{t:'date'})}</div>${fi(`st.${i}.pr`,'Progress '+x.pr+'%',{t:'range',n:1,x:'min=0 max=100 step=5'})}</div>`:''}</div>`}).join('')}

function money(){const b=+S.p.budget||0,sp=spent(),pr=prog(),fc=pr>0?sp/(pr/100):0,add=Math.max(0,fc-b),rem=b-sp;
return `<div class=c><span class=k>Funds</span><table class=tb><tr><td>Approved<td>${inr(b)}</tr><tr><td>Spent to date<td>${inr(sp)}</tr><tr><td>Remaining<br><small class=m>approved − spent</small><td ${rem<0?'style="color:var(--a)"':''}>${inr(rem)}</tr><tr><td>Projected at completion<br><small class=m>spent ÷ progress (linear)</small><td>${pr>0?inr(fc):'needs progress > 0%'}</tr><tr><td>Projected extra funds<br><small class=m>max(0, projected − approved)</small><td>${pr>0?inr(add):'–'}</tr></table>${rem<0?'<div class=w>Overspent against approved budget.</div>':''}</div>
<div class=c><span class=k>Add expenditure</span><div class=gr><label class=k>Date<input type=date id=xd value="${ld(new Date())}"></label><label class=k>Amount (₹)<input type=number id=xa></label></div><label class=k>Description<input id=xs></label><button class=b data-a=addx>Add</button></div>
${S.ex.map((e,i)=>`<div class=c style="display:flex;justify-content:space-between;align-items:center"><span>${e.d} · ${esc(e.s)}<br><b>${inr(e.a)}</b></span><button class="b g sm" data-a=delx data-i=${i}>Remove</button></div>`).join('')}`}

const V={home,plans,est,site,sched,money},TL={home:'Home',plans:'Plans',est:'Estimate',site:'Site',sched:'Timeline',money:'Funds'};
function render(){const r=document.documentElement;r.lang=S.lang;S.th==='auto'?r.removeAttribute('data-theme'):r.dataset.theme=S.th;
$('#app').innerHTML=`<header><h1><b></b>CivilVerify</h1><span style="display:flex;gap:6px;align-items:center"><select class=lg data-p=lang aria-label="Language">${Object.keys(LG).map(k=>`<option value=${k} ${S.lang===k?'selected':''}>${LG[k]}</option>`).join('')}</select><button class="b g sm" data-a=th>${{auto:'Auto',light:'Day',dark:'Night'}[S.th]}</button></span></header>${V[S.tab]()}<nav><div>${Object.keys(V).map(k=>`<button class="${S.tab===k?'on':''}" data-a=tab data-i=${k}>${TL[k]}</button>`).join('')}</div></nav>`;trDom($('#app'));if(S.tab==='site')draw3d();if(S.tab==='home'&&!WX.tried){WX.tried=1;wxGet()}}
document.addEventListener('click',async e=>{const a=e.target.closest('[data-a]');if(!a)return;const k=a.dataset.a,i=a.dataset.i;if(k!=='delp')S.cf=null;
if(k==='tab'){S.tab=i;scrollTo(0,0)}else if(k==='th')S.th={auto:'light',light:'dark',dark:'auto'}[S.th];else if(k==='cm')S.cm+=+i;
else if(k==='loc'){a.textContent='Locating…';await chk()}
else if(k==='useloc'){try{const c=(await gp()).coords;S.p.lat=c.latitude.toFixed(6);S.p.lng=c.longitude.toFixed(6)}catch(x){toast('Could not read location')}}
else if(k==='addx'){const am=+$('#xa').value;if(!(am>0))return toast('Enter an amount');S.ex.push({d:$('#xd').value,a:am,s:$('#xs').value||'Expense'})}
else if(k==='delx')S.ex.splice(+i,1);
else if(k==='tg'){S.open=S.open||{};S.open[i]=!S.open[i]}
else if(k==='wx'){wxGet(true)}
else if(k==='rot'){VIEW.yaw+=+i;draw3d();return}
else if(k==='addp'){S.pj[S.cur]=pk();S.pj.push(fresh());sw(S.pj.length-1);scrollTo(0,0)}
else if(k==='sw'){sw(+i);scrollTo(0,0)}
else if(k==='delp'){const n=+i;if(S.cf!==n)S.cf=n;else{S.cf=null;if(n!==S.cur)S.pj[S.cur]=pk();S.pj.splice(n,1);if(!S.pj.length)S.pj.push(fresh());if(n<S.cur)S.cur--;else if(n===S.cur)S.cur=Math.min(S.cur,S.pj.length-1);PK.forEach(f=>S[f]=S.pj[S.cur][f]);toast('Project removed')}}
else if(k==='rmp'){delete S.plans[a.dataset.s];toast('Plan removed')}
else if(k==='use'){const g=sugs(a.dataset.s)[+i];if(g){setp(g.path,Math.round(g.val*100)/100);S.est.t=g.el;S.tab='est';scrollTo(0,0);toast('Added to Estimate. Fill the remaining dimensions.')}}
save();render()});
document.addEventListener('change',async e=>{const t=e.target;
if(t.dataset.p){if(t.dataset.p==='cs')return S.cs=t.value;setp(t.dataset.p,t.dataset.n?+t.value:t.value);const m=/^st\.(\d+)\./.exec(t.dataset.p);if(m){S.open=S.open||{};S.open[m[1]]=true}}
else if(t.dataset.slot){const f=t.files[0];if(!f)return;const ext=f.name.split('.').pop().toLowerCase();let info=`${(f.size/1024).toFixed(0)} KB. `;
let an=null,v=null;
if(ext==='dxf'){an=dxfAn(await rd(f,1));info+=`${an.n} drawing items read.`}
else if(ext==='dwg')info+='DWG not parsed. Convert to DXF.';
else if(ext==='pdf'){toast('Reading PDF text…');try{an=txtAn(await pdfText(f));info+=an.n?`${an.n} characters of text read.`:'No readable text (scanned or image-only).'}catch(x){info+='Could not read this PDF. Open the page once online, or enter dimensions in Estimate.'}
try{v=await pdfVec(f);if(v.R.length)info+=` ${v.R.length} drawn rectangles read for the 3D model.`}catch(x){v=null}}
else info+='Image plans cannot be read offline. Enter dimensions in Estimate.';
S.plans[t.dataset.slot]={name:f.name,ty:ext.toUpperCase(),info,an,v,unit:an&&an.k==='dxf'?(UC[an.u]||''):''};S.open=S.open||{};S.open['p'+slots().indexOf(t.dataset.slot)]=true}
else if(t.id==='cam'){const v=verdict();if(!v||!v.ok)return toast(v?v.m:'Check location first');const f=t.files[0];if(!f)return;const img=await comp(await rd(f));if(!img)return toast('Could not read photo');const l=S.loc,n=new Date();
S.ev.unshift({img,s:S.cs||S.st[0].n,n:$('#nt').value||'',lat:l.lat,lng:l.lng,acc:l.acc,d:ld(n),tm:n.toTimeString().slice(0,5)});toast('Evidence saved')}
else return;save();render()});
document.addEventListener('pointerdown',e=>{if(e.target.id==='m3'){VIEW.drag={x:e.clientX,y:VIEW.yaw};try{e.target.setPointerCapture(e.pointerId)}catch(x){}}});
document.addEventListener('pointermove',e=>{if(VIEW.drag){VIEW.yaw=VIEW.drag.y+(e.clientX-VIEW.drag.x)*.6;draw3d()}});
document.addEventListener('pointerup',()=>{VIEW.drag=null});
render();
</script></body></html>
