<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CivilVerify</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Space+Mono:wght@400;700&display=swap">
<style>
:root{--bg:#f5f1de;--s:#fff3b8;--s2:#fffdf3;--t:#151515;--m:#6f6a55;--l:#ddd5ac;--a:#ff5a1f;--dot:#d6cd9f;--nav:#151515;--nt:#f5f1de;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070707;--s:#1a120d;--s2:#121212;--t:#f2efe8;--m:#8d8a82;--l:#2b2b2b;--dot:#252525;--nav:#1c1c1c;--nt:#f2efe8;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#070707;--s:#1a120d;--s2:#121212;--t:#f2efe8;--m:#8d8a82;--l:#2b2b2b;--dot:#252525;--nav:#1c1c1c;--nt:#f2efe8;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg) radial-gradient(var(--dot) 1px,transparent 1.4px) 0 0/14px 14px;color:var(--t);font:13px/1.5 "Space Mono",ui-monospace,Menlo,monospace}
#app{max-width:600px;margin:0 auto;padding:14px 14px 110px}
h1,.n{font-family:"DotGothic16","Space Mono",monospace;font-weight:400}
h1{font-size:24px;margin:0;display:flex;align-items:center;gap:8px}
h1 b{width:12px;height:12px;border-radius:50%;background:var(--a);display:inline-block}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.c{background:var(--s2);border:1px solid var(--l);border-radius:24px;padding:16px;margin:0 0 12px}
.c.y{background:var(--s)}
.k{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--m);display:block}
.n{font-size:54px;line-height:1.05}.n small{font-size:20px;color:var(--a)}.n.s{font-size:28px}
.bar{height:8px;border-radius:9px;background:var(--l);overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--a)}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:10px}.gr>*{min-width:0}
input,select,textarea{width:100%;margin-top:4px;background:transparent;color:var(--t);border:1px solid var(--l);border-radius:12px;padding:9px 10px;font:inherit;font-size:13px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--a);outline-offset:1px}
input[type=range]{padding:0;accent-color:var(--a)}
label{display:block;margin-bottom:8px}
.b{background:var(--a);color:#fff;border:0;border-radius:99px;padding:10px 16px;font:inherit;font-weight:700;font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.b.g{background:transparent;color:var(--t);border:1px solid var(--t)}.b.sm{padding:6px 12px}
.ch{display:inline-block;border:1px solid var(--m);border-radius:99px;padding:1px 9px;font-size:10px;text-transform:uppercase;letter-spacing:.08em}
.ch.o{background:var(--a);border-color:var(--a);color:#fff}
.w{border:1px dashed var(--a);border-radius:14px;padding:10px;margin:8px 0;font-size:12px}.ok{border-style:solid}
.tb{width:100%;border-collapse:collapse;font-size:12px}.tb td,.tb th{padding:6px 4px;border-bottom:1px dashed var(--l);text-align:left;vertical-align:top}.tb th{font-size:10px;color:var(--m);text-transform:uppercase}
.sc{overflow-x:auto}.r{display:flex;height:40px;align-items:center}
.lb{position:sticky;left:0;width:104px;flex:none;background:var(--s2);z-index:2;font-size:11px;height:100%;display:flex;align-items:center}
.tr{position:relative;height:100%}.bz{position:absolute;border-radius:9px}
.pl{top:6px;height:10px;border:1px dashed var(--m)}.ac{top:20px;height:12px;background:rgba(255,90,31,.3);overflow:hidden}.ac i{display:block;height:100%;background:var(--a)}
.tr u{position:absolute;top:0;bottom:0;width:1px;background:var(--a)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:11px}
.d{aspect-ratio:1;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.d.t{background:var(--a);color:#fff}.d s{text-decoration:none;font-size:9px;color:var(--a);height:9px}
.th{color:var(--m);font-size:9px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 10px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
nav div{pointer-events:auto;display:flex;gap:2px;background:var(--nav);border-radius:99px;padding:6px;max-width:100%;overflow-x:auto}
nav button{background:none;border:0;color:var(--nt);opacity:.6;font:inherit;font-size:10px;text-transform:uppercase;letter-spacing:.06em;padding:9px 11px;border-radius:99px;cursor:pointer}
nav button.on{background:var(--a);color:#fff;opacity:1}
.ev{display:flex;gap:10px;margin-bottom:10px}.ev img{width:72px;height:72px;object-fit:cover;border-radius:14px}
#t{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--a);color:#fff;padding:8px 16px;border-radius:99px;z-index:9;display:none;font-size:12px;max-width:90%}
small.m{color:var(--m);font-size:11px;display:block}
</style></head><body>
<div id="t"></div><div id="app"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ld=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10),days=s=>Date.parse(s)/864e5;
const inr=n=>'₹'+Math.round(n).toLocaleString('en-IN'),f2=n=>(+n).toLocaleString('en-IN',{maximumFractionDigits:2});
const SK='cv4';let S=load();
function init(){const d=new Date(),a=n=>ld(new Date(+d+n*864e5));return{th:'auto',tab:'home',cm:0,p:{name:'',type:'PMAY house',fl:'G',lat:'',lng:'',rad:50,budget:'',start:a(0)},plans:{},ex:[],ev:[],loc:null,rates:{cement:420,steel:65,sand:1800,agg:1600,brick:8},est:{t:'footing',pct:1,v:{}},st:['Site layout','Excavation','Footing','Plinth','Column','Beam & slab','Brickwork','Plaster & finish'].map((n,i)=>({n,ps:a(i*14),pe:a(i*14+12),as:'',ae:'',pr:0}))}}
function load(){try{return JSON.parse(localStorage.getItem(SK))||init()}catch(e){return init()}}
function save(){try{localStorage.setItem(SK,JSON.stringify(S))}catch(e){toast('Storage full: remove some evidence photos')}}
function toast(m){const t=$('#t');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',3500)}
function setp(p,v){const k=p.split('.');let o=S;for(let i=0;i<k.length-1;i++)o=o[k[i]]=o[k[i]]||{};o[k[k.length-1]]=v}
const getp=p=>p.split('.').reduce((a,k)=>a?.[k],S);
const fi=(p,l,o={})=>`<label class=k>${l}<input data-p="${p}" ${o.n?'data-n=1':''} type="${o.t||'text'}" value="${esc(getp(p))}" ${o.x||''}></label>`;
const sl=(p,l,opts)=>`<label class=k>${l}<select data-p="${p}">${opts.map(o=>`<option ${getp(p)==o?'selected':''}>${o}</option>`).join('')}</select></label>`;
const prog=()=>Math.round(S.st.reduce((a,x)=>a+(+x.pr||0),0)/S.st.length),spent=()=>S.ex.reduce((a,x)=>a+x.a,0);
const stat=x=>x.pr>=100?'Done':(ld(new Date())>x.pe&&x.pr<100)?'Delayed':(x.as||x.pr>0)?'In progress':'Planned';
const slots=()=>['Complete house plan',...(S.p.fl==='G'?['Ground floor plan']:['Ground floor plan','First floor plan']),'Elevation drawing','Specifications'];
const hv=(a,b,c,d)=>{const r=Math.PI/180,x=Math.sin((c-a)*r/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin((d-b)*r/2)**2;return 12742e3*Math.asin(Math.sqrt(x))};
const gp=()=>new Promise((ok,no)=>navigator.geolocation?navigator.geolocation.getCurrentPosition(ok,no,{enableHighAccuracy:true,timeout:15000,maximumAge:0}):no({}));
const rd=(f,txt)=>new Promise(r=>{const x=new FileReader;x.onload=()=>r(x.result);x.onerror=()=>r('');txt?x.readAsText(f):x.readAsDataURL(f)});
function comp(u){return new Promise(r=>{const i=new Image;i.onload=()=>{const k=Math.min(1,360/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.6))};i.onerror=()=>r('');i.src=u})}
function dxf(t){const L=t.split(/\r?\n/),c={},X=[],Y=[],G=['LINE','LWPOLYLINE','CIRCLE','ARC'],U={1:'in',2:'ft',4:'mm',5:'cm',6:'m'};let e='',u='';
for(let i=0;i+1<L.length;i+=2){const g=L[i].trim(),v=L[i+1].trim();
if(g==='9'&&v==='$INSUNITS'){u=U[+L[i+3]]||'';}
if(g==='0'){e=v;if([...G,'POLYLINE','TEXT','MTEXT'].includes(v))c[v]=(c[v]||0)+1}
else if(G.includes(e)){if(g==='10'||g==='11')X.push(+v);if(g==='20'||g==='21')Y.push(+v)}}
const w=X.length?Math.max(...X)-Math.min(...X):0,h=Y.length?Math.max(...Y)-Math.min(...Y):0;
return `DXF entities: ${Object.entries(c).map(a=>a.join(' ')).join(', ')||'none found'}. Extent ${f2(w)} × ${f2(h)} ${u||'units (unit not declared: confirm before use)'}.`}

const ED={
footing:{n:'Footing',c:1,u:'m³',f:[['n','Nos'],['l','Length (m)'],['b','Width (m)'],['d','Depth (m)']],v:x=>x.n*x.l*x.b*x.d,fx:x=>`${x.n} × ${x.l} × ${x.b} × ${x.d}`},
column:{n:'Column',c:1,u:'m³',f:[['n','Nos'],['b','Width (m)'],['d','Depth (m)'],['h','Height (m)']],v:x=>x.n*x.b*x.d*x.h,fx:x=>`${x.n} × ${x.b} × ${x.d} × ${x.h}`},
slab:{n:'Slab',c:1,u:'m³',f:[['a','Slab area (m²)'],['t','Thickness (m)']],v:x=>x.a*x.t,fx:x=>`${x.a} × ${x.t}`},
wall:{n:'Brickwork',c:0,u:'m³',f:[['l','Wall length (m)'],['h','Height (m)'],['t','Thickness (m)'],['o','Openings (m²)']],v:x=>(x.l*x.h-x.o)*x.t,fx:x=>`(${x.l} × ${x.h} − ${x.o}) × ${x.t}`}};
function calc(D,x){const n={};D.f.forEach(([k])=>n[k]=x[k]===''||x[k]==null?NaN:+x[k]);
const bad=D.f.filter(([k])=>!(n[k]>=0)||(k!=='o'&&n[k]===0));
if(bad.length)return `<div class=w>Missing or invalid: <b>${bad.map(b=>b[1]).join(', ')}</b>. Nothing is estimated until you enter it; no value is guessed.</div>`;
const v=D.v(n),R=S.rates,pct=+S.est.pct,rows=[['Volume',v,D.u,D.fx(n),0]];
if(D.c){const dry=v*1.54;rows.push(['Cement',dry/5.5/.035,'bags',`vol × 1.54 ÷ 5.5 ÷ 0.035 (M20 1:1.5:3)`,R.cement],['Sand',dry*1.5/5.5,'m³','dry vol × 1.5 ÷ 5.5',R.sand],['Aggregate',dry*3/5.5,'m³','dry vol × 3 ÷ 5.5',R.agg],['Steel',v*pct/100*7850,'kg',`vol × ${pct}% × 7850`,R.steel])}
else{const m=v*.25*1.27;rows.push(['Bricks',v*500,'nos','vol × 500 (thumb rule)',R.brick],['Mortar cement',m/7/.035,'bags','vol × 0.25 × 1.27 ÷ 7 ÷ 0.035 (1:6)',R.cement],['Mortar sand',m*6/7,'m³','mortar dry vol × 6 ÷ 7',R.sand])}
const tot=rows.reduce((a,r)=>a+r[1]*r[4],0);
return `${D.c&&(pct<.8||pct>2)?'<div class=w>Steel % is outside the usual 0.8–2% range. Check it.</div>':''}<div class=sc><table class=tb><tr><th>Item<th>Qty<th>Basis<th>Cost</tr>${rows.map(r=>`<tr><td>${r[0]}<td>${f2(r[1])} ${r[2]}<td><small class=m>${esc(r[3])}</small><td>${r[4]?inr(r[1]*r[4]):'–'}</tr>`).join('')}<tr><td colspan=3><b>Total (recomputed in code)</b><td><b>${inr(tot)}</b></tr></table></div><small class=m>Thumb-rule quantities. They are not structural design or engineer approval.</small>`}

function cal(){const d=new Date(),m=new Date(d.getFullYear(),d.getMonth()+S.cm,1),y=m.getFullYear(),mo=m.getMonth(),fst=(m.getDay()+6)%7,N=new Date(y,mo+1,0).getDate(),mk={};
const ad=(s,c)=>{if(s)(mk[s]=mk[s]||new Set).add(c)};S.st.forEach(x=>{ad(x.ps,'◌');ad(x.pe,'◌')});S.ev.forEach(e=>ad(e.d,'●'));S.ex.forEach(e=>ad(e.d,'₹'));
let h='';for(let i=0;i<fst;i++)h+='<div></div>';
for(let i=1;i<=N;i++){const k=`${y}-${String(mo+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;h+=`<div class="d ${k===ld(d)?'t':''}">${i}<s>${[...(mk[k]||[])].join('')}</s></div>`}
return `<div class=c><div style="display:flex;justify-content:space-between;align-items:center"><span class=k>${m.toLocaleString('en',{month:'long',year:'numeric'})}</span><span><button class="b g sm" data-a=cm data-i=-1>‹</button> <button class="b g sm" data-a=cm data-i=1>›</button></span></div><div class=cal style="margin-top:8px">${'MTWTFSS'.split('').map(x=>`<div class=th>${x}</div>`).join('')}${h}</div><small class=m>◌ planned stage date · ● site photo · ₹ expense</small></div>`}

function home(){const q=S.p,pr=prog(),sp=spent(),rem=(+q.budget||0)-sp,pend=[];
const ms=slots().filter(s=>!S.plans[s]).length,late=S.st.filter(x=>stat(x)==='Delayed').length;
if(!q.name)pend.push('Name the project');if(ms)pend.push(`${ms} plan upload(s) missing`);if(late)pend.push(`${late} delayed stage(s)`);if(q.lat==='')pend.push('Set site coordinates for geofence');if(!+q.budget)pend.push('Enter approved budget');pend.push('Replace placeholder rates in Estimate');
return `<div class="c y"><span class=k>Overall progress</span><div class=n>${pr}<small>%</small></div><div class=bar><i style="width:${pr}%"></i></div></div>
<div class=gr><div class=c><span class=k>Spent</span><div class="n s">${inr(sp)}</div></div><div class=c><span class=k>Remaining</span><div class="n s" ${rem<0?'style="color:var(--a)"':''}>${inr(rem)}</div></div></div>
<div class=c><span class=k>Pending</span>${pend.map(p=>`<div>○ ${p}</div>`).join('')}</div>${cal()}
<div class=c><span class=k>Project setup</span><div style="margin-top:8px">${fi('p.name','Project name')}${sl('p.type','Type',['PMAY house','Panchayat building','School / Anganwadi','PWD building'])}${sl('p.fl','Floors',['G','G+1'])}
<div class=gr>${fi('p.budget','Approved budget (₹)',{t:'number',n:1})}${fi('p.start','Start date',{t:'date'})}${fi('p.lat','Site latitude',{t:'number',x:'step=any'})}${fi('p.lng','Site longitude',{t:'number',x:'step=any'})}${fi('p.rad','Geofence radius (m)',{t:'number',n:1})}</div>
<button class="b g sm" data-a=useloc>Use my location as site centre</button></div></div>`}

function plans(){return `<div class=c><span class=k>Plan uploads · ${S.p.fl==='G'?'Ground floor':'Ground + first floor'}</span><small class=m>Only file details and extracted facts are kept on this device. Files are not stored.</small></div>`+slots().map(s=>{const p=S.plans[s];return `<div class=c><span class=k>${s}</span>${p?`<div><b>${esc(p.name)}</b> <span class=ch>${p.ty}</span></div><small class=m>${esc(p.info)}</small>`:'<span class="ch o">Missing</span>'}<input type=file data-slot="${esc(s)}" accept=".pdf,.dxf,.dwg,image/*"></div>`}).join('')+`<div class=w>DWG is not parsed here. Convert it to DXF. For PDF and images, dimensions are entered manually in Estimate. The app asks instead of guessing.</div>`}

function est(){const E=S.est,D=ED[E.t],R=S.rates;
return `<div class=c>${sl('est.t','Element',Object.keys(ED)).replace(/<option( selected)?>(\w+)<\/option>/g,(m,s,k)=>`<option value=${k}${s||''}>${ED[k].n}</option>`)}
<div class=gr>${D.f.map(([k,l])=>fi(`est.v.${E.t}.${k}`,l,{t:'number',x:'step=any min=0'})).join('')}</div>${D.c?fi('est.pct','Steel % of concrete (assumption)',{t:'number',x:'step=any'}):''}${calc(D,E.v[E.t]||{})}</div>
<div class=c><span class=k>Material rates (₹) · editable</span><div class=w>Placeholders. Enter your existing rates; they are never changed automatically.</div><div class=gr>${[['cement','Cement / bag'],['steel','Steel / kg'],['sand','Sand / m³'],['agg','Aggregate / m³'],['brick','Brick / nos']].map(([k,l])=>fi('rates.'+k,l,{t:'number',n:1})).join('')}</div></div>`}

async function chk(){try{const c=(await gp()).coords,q=S.p;S.loc={lat:c.latitude,lng:c.longitude,acc:c.accuracy,d:q.lat===''||q.lng===''?null:hv(+q.lat,+q.lng,c.latitude,c.longitude),t:Date.now()}}catch(x){S.loc={err:x&&x.code===1?'Permission denied. Allow location in your browser or app settings.':'Could not get a location fix.'}}}
function verdict(){const l=S.loc;if(!l)return null;if(l.err)return{ok:0,m:l.err};if(l.d==null)return{ok:0,m:'Set site coordinates on Home first.'};if(l.acc>50)return{ok:0,m:`GPS accuracy ±${Math.round(l.acc)} m is too coarse (limit 50 m). Retry outdoors.`};if(l.d>+S.p.rad)return{ok:0,m:`Outside geofence: ${Math.round(l.d)} m from centre, radius ${S.p.rad} m.`};if(Date.now()-l.t>3e5)return{ok:0,m:'Location check expired. Check again.'};return{ok:1,m:`Inside geofence: ${Math.round(l.d)} m from centre, accuracy ±${Math.round(l.acc)} m.`}}
function site(){const v=verdict();
return `<div class=c><span class=k>Location check</span><p>Camera unlocks only after a fresh GPS fix inside the site boundary.</p><button class=b data-a=loc>Check my location</button>${v?`<div class="w ${v.ok?'ok':''}">${v.m}</div>`:''}
${v&&v.ok?`<label class=k style="margin-top:10px">Stage<select data-p="cs">${S.st.map(x=>`<option>${esc(x.n)}</option>`).join('')}</select></label><label class=k>Note<input id=nt></label><input type=file id=cam accept="image/*" capture=environment>`:''}
<small class=m>A client-side GPS check can be spoofed. This is a location check, not tamper-proof proof of presence.</small></div>
${S.ev.map(e=>`<div class="c ev"><img src="${e.img}" alt=""><div><b>${esc(e.s)}</b><br>${e.d} ${e.tm}<br><small class=m>${e.lat.toFixed(5)}, ${e.lng.toFixed(5)} · ±${Math.round(e.acc)} m<br>${esc(e.n)}</small></div></div>`).join('')||'<div class=c><span class=k>No site evidence yet</span></div>'}`}

function gantt(){const t=days(ld(new Date())),ds=[t];S.st.forEach(x=>['ps','pe','as','ae'].forEach(k=>x[k]&&ds.push(days(x[k]))));const mn=Math.min(...ds)-1,W=(Math.max(...ds)+2-mn)*10;
const bz=(s,e,c,p)=>s&&e?`<div class="bz ${c}" style="left:${(days(s)-mn)*10}px;width:${Math.max(10,(days(e)-days(s)+1)*10)}px">${p?`<i style="width:${p}%"></i>`:''}</div>`:'';
return `<div class=sc><div style="min-width:${W+104}px">${S.st.map(x=>`<div class=r><div class=lb>${esc(x.n)}</div><div class=tr style="width:${W}px">${bz(x.ps,x.pe,'pl')}${bz(x.as,x.ae||ld(new Date()),'ac',x.pr)}<u style="left:${(t-mn)*10}px"></u></div></div>`).join('')}</div></div><small class=m>Dashed = planned · filled = actual progress · line = today</small>`}
function sched(){return `<div class=c><span class=k>Construction timeline</span>${gantt()}</div>`+S.st.map((x,i)=>`<div class=c><div style="display:flex;justify-content:space-between"><b>${esc(x.n)}</b><span class="ch ${stat(x)==='Delayed'?'o':''}">${stat(x)}</span></div><div class=gr>${fi(`st.${i}.ps`,'Planned start',{t:'date'})}${fi(`st.${i}.pe`,'Planned end',{t:'date'})}${fi(`st.${i}.as`,'Actual start',{t:'date'})}${fi(`st.${i}.ae`,'Actual end',{t:'date'})}</div>${fi(`st.${i}.pr`,'Progress '+x.pr+'%',{t:'range',n:1,x:'min=0 max=100 step=5'})}</div>`).join('')}

function money(){const b=+S.p.budget||0,sp=spent(),pr=prog(),fc=pr>0?sp/(pr/100):0,add=Math.max(0,fc-b),rem=b-sp;
return `<div class=c><span class=k>Funds</span><table class=tb><tr><td>Approved<td>${inr(b)}</tr><tr><td>Spent to date<td>${inr(sp)}</tr><tr><td>Remaining<br><small class=m>approved − spent</small><td ${rem<0?'style="color:var(--a)"':''}>${inr(rem)}</tr><tr><td>Projected at completion<br><small class=m>spent ÷ progress (linear)</small><td>${pr>0?inr(fc):'needs progress > 0%'}</tr><tr><td>Projected extra funds<br><small class=m>max(0, projected − approved)</small><td>${pr>0?inr(add):'–'}</tr></table>${rem<0?'<div class=w>Overspent against approved budget.</div>':''}</div>
<div class=c><span class=k>Add expenditure</span><div class=gr><label class=k>Date<input type=date id=xd value="${ld(new Date())}"></label><label class=k>Amount (₹)<input type=number id=xa></label></div><label class=k>Description<input id=xs></label><button class=b data-a=addx>Add</button></div>
${S.ex.map((e,i)=>`<div class=c style="display:flex;justify-content:space-between;align-items:center"><span>${e.d} · ${esc(e.s)}<br><b>${inr(e.a)}</b></span><button class="b g sm" data-a=delx data-i=${i}>Remove</button></div>`).join('')}`}

const V={home,plans,est,site,sched,money},TL={home:'Home',plans:'Plans',est:'Estimate',site:'Site',sched:'Timeline',money:'Funds'};
function render(){const r=document.documentElement;S.th==='auto'?r.removeAttribute('data-theme'):r.dataset.theme=S.th;
$('#app').innerHTML=`<header><h1><b></b>CivilVerify</h1><button class="b g sm" data-a=th>${{auto:'Auto',light:'Day',dark:'Night'}[S.th]}</button></header>${V[S.tab]()}<nav><div>${Object.keys(V).map(k=>`<button class="${S.tab===k?'on':''}" data-a=tab data-i=${k}>${TL[k]}</button>`).join('')}</div></nav>`}
document.addEventListener('click',async e=>{const a=e.target.closest('[data-a]');if(!a)return;const k=a.dataset.a,i=a.dataset.i;
if(k==='tab'){S.tab=i;scrollTo(0,0)}else if(k==='th')S.th={auto:'light',light:'dark',dark:'auto'}[S.th];else if(k==='cm')S.cm+=+i;
else if(k==='loc'){a.textContent='Locating…';await chk()}
else if(k==='useloc'){try{const c=(await gp()).coords;S.p.lat=c.latitude.toFixed(6);S.p.lng=c.longitude.toFixed(6)}catch(x){toast('Could not read location')}}
else if(k==='addx'){const am=+$('#xa').value;if(!(am>0))return toast('Enter an amount');S.ex.push({d:$('#xd').value,a:am,s:$('#xs').value||'Expense'})}
else if(k==='delx')S.ex.splice(+i,1);
save();render()});
document.addEventListener('change',async e=>{const t=e.target;
if(t.dataset.p){if(t.dataset.p==='cs')return S.cs=t.value;setp(t.dataset.p,t.dataset.n?+t.value:t.value)}
else if(t.dataset.slot){const f=t.files[0];if(!f)return;const ext=f.name.split('.').pop().toLowerCase();let info=`${(f.size/1024).toFixed(0)} KB. `;
if(ext==='dxf')info+=dxf(await rd(f,1));else if(ext==='dwg')info+='DWG not parsed. Convert to DXF.';else info+='Dimensions need manual entry in Estimate.';
S.plans[t.dataset.slot]={name:f.name,ty:ext.toUpperCase(),info}}
else if(t.id==='cam'){const v=verdict();if(!v||!v.ok)return toast(v?v.m:'Check location first');const f=t.files[0];if(!f)return;const img=await comp(await rd(f));if(!img)return toast('Could not read photo');const l=S.loc,n=new Date();
S.ev.unshift({img,s:S.cs||S.st[0].n,n:$('#nt').value||'',lat:l.lat,lng:l.lng,acc:l.acc,d:ld(n),tm:n.toTimeString().slice(0,5)});toast('Evidence saved')}
else return;save();render()});
render();
</script></body></html>
